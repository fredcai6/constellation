# The command palette: this repo's own commands and model tiers, plus the
# chain root set below. One of the two artifacts v2 allows to be repo-specific
# (the other is the glossary). A gate spec's `check` field reaches a runner
# through these names -- `palette:test tests/x.py` -- so a spec names the
# job, not the command.

[commands]
# `test` is the fast suite -- no model calls, but not free: it drives real
# git and journal I/O per test, so it runs closer to two minutes than
# seconds. Run it constantly anyway -- the cost is I/O, not a model.
test = "python3 -m pytest -q"
# `validate` is what a run's own gates should check, and what to run before
# anything ships: the fast suite plus the agent evals, which drive a real
# light model against a real run and assert on its journal.
validate = "python3 -m pytest -q && python3 -m pytest evals -q"
# `validate-gate-loop` is the fast suite plus exactly one eval: the drive that
# carries a gate through implement, review and close from its orders alone. It
# is for a gate whose diff touches that one drive's assertions or the identity
# it dispatches under. It covers neither the other three cases in that eval's
# own file nor the wider `evals/` sweep `validate` runs, so it is a rung
# between `test` and `validate`, not a stand-in for either.
validate-gate-loop = "python3 -m pytest -q && python3 -m pytest 'evals/test_implementer_reviewer_and_conductor.py::test_an_implementer_completes_a_gate_from_its_orders_alone' -q"
# `map` is the closeout call: the derived code map, built into .code-map/ and map/,
# both gitignored. Never committed -- a stale committed map is the failure #7 names.
# `--render-only` narrows the page tree to one package; the walk behind it stays
# whole, so the referenced-by-tests column survives. Repeat it to add packages.
map = "python3 -m tools.code_map build --root . --artifacts .code-map --out map --render-only engine"
# `dispatch` is the real harness `wait` actually starts a dispatch or panel
# room's outstanding child through -- `evals/harness.py`'s own `cmd` in
# full (around evals/harness.py:128-129), so the one process every eval
# already drives by hand is the same one `wait` now starts itself.
# `--append-system-prompt` carries the one fact about this harness a brief cannot: a
# headless process is never woken. Twelve children across three runs died by starting a
# check in the background and ending their turn to "wait for the notification".
dispatch = ["claude", "-p", "{brief}", "--model", "{runner}", "--allowedTools", "Bash", "Read", "Write", "Edit", "--append-system-prompt", "You are a headless process started by an engine. Nothing will ever notify you: no background task, no timer, no other agent. Run every command in the foreground and read its output before going on; never start a check in the background and never end your turn to wait for anything. Your turn ends only when the room you were handed says your step is done."]

# Logical tiers, resolved at dispatch. Forms and assemblies name only the
# tier, never a provider, so an assembly is portable across shops.
[models]
light = "claude-haiku-4-5-20251001"
standard = "claude-sonnet-5"
heavy = "claude-opus-5"

# Every role a form step's filler names, other than the bare `conductor`
# indirection (reserved to "heavy" structurally, in engine/cli.py's own
# `_role_tier` -- never a table entry here), mapped to its tier.
[roles]
planner = "standard"
implementer = "standard"
excursion = "standard"
reviewer = "standard"
spec-writer = "standard"

# Epic #138 finding 10: the documents a purpose chain is allowed to
# terminate at, rather than climb past. A claim counts as a root when its
# anchor lives in one of these files -- Part 1 of the same finding is what
# lets a chain name a claim instead of a whole document. This belongs here,
# not in a check's own source, for the same reason the command palette
# above does: `standards/approach.md` travels to any repository this
# system runs in and its five are a root wherever it lands, but
# `docs/PURPOSE.md` is this repository's own page and does not travel --
# a root set baked into code cannot tell a portable root from a local one,
# and would either follow `approach.md` to a repo with no `PURPOSE.md` or
# hardcode this repo's path into a mechanism meant to travel.
[roots]
documents = ["docs/PURPOSE.md", "standards/approach.md"]
