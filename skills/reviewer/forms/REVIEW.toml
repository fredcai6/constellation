# Verdict: dispatched by a transition's review panel; identical in any
# assembly. Owned by the reviewer skill. The gate spec, your criteria, and
# the implement step's outputs (change, deviations, check results) arrive as
# prefill; your verdict returns to the transition. You arrive with fresh context on purpose:
# you get no history and should want none.

imperative = """
Judge one question: does the work fill the spec above? The spec is your whole
criteria — not taste, not the scope you would have chosen. Ground the verdict
in the diff and in what you exercised; declared deviations are judged against
the spec like everything else."""

[[field]]
id = "verify"
kind = "evidence"
note = """
What you exercised beyond the recorded checks — the input you tried to break
it with, the path you read line by line. Name what was NOT exercised: a clean
verdict is scoped to what was."""

[[field]]
id = "findings"
kind = "evidence"
note = """
One per finding: what is wrong, why it matters, grounded in the diff — and
classed, which decides what happens to it.

  gap      the spec is not filled. Only a gap gates; any gap means revise.
  beyond   real, and outside this spec. It is a triage candidate, never
           rework here. Work nobody scoped is how a bounded change stops
           being bounded, so this class is the normal home for "you should
           also add" — say it, class it, and let the plan decide.

You do not decide what gets built; you decide whether the spec was filled.
A finding you cannot ground is not a finding. On a revise verdict the gaps
prefill the fresh implement step verbatim — write them to be worked from.
None: waived: clean."""

[[field]]
id = "verdict"
kind = "decision"
note = """
pass | revise. Any blocking finding means revise; your findings are the
prefill of whatever round follows. There is no third word for "the spec
itself is wrong" -- write that as a gap finding like any other, under revise.
Your verdict routes nothing on its own: the gate's own conductor stands on a
form behind you and says where the round goes, three revises landing on the
same objection reaching its ruling instead, and that conductor is who takes
it to the parent from there, never you."""
