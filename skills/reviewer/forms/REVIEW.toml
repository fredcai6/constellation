# Verdict: dispatched by a gate's review panel. Owned by the reviewer skill.
# The gate spec, your criteria and the implement step's outputs arrive as
# prefill; your verdict returns to the gate's route form.

imperative = """
Answer your criteria, printed first in this room. It is the one question you
were sent to answer; the other readers on this panel hold the other questions.

The gate spec in your orders -- purpose, scope, proof -- is what the work is
measured against. The diff is uncommitted in the tree: read it, run it, test
it. The engine has already run the gate's proof and recorded the result in
your orders, so run it again only where your criteria needs more than that
result.

Ground every finding in the diff or in something you ran."""

[[field]]
id = "verify"
kind = "evidence"
note = """
What you did to answer your criteria: each command you ran and what it
showed, each scenario you tried, each path you read line by line. Then what
you did NOT exercise. A pass covers only what you checked."""

[[field]]
id = "findings"
kind = "evidence"
note = """
One per finding: what is wrong, why it matters, and the line of the diff or
the command output that shows it.

  gap      the work fails your criteria, or leaves the gate spec unfilled.
           Any gap means revise.

A finding that is real but outside this gate's spec is not a gap. Write it
anyway and say it is out of scope; the gate's conductor rules on it.

A revise hands your gaps to the next implement round word for word, so write
each one so it can be worked from alone. A finding you cannot ground is not
a finding. No findings: waived: clean."""

[[field]]
id = "verdict"
kind = "decision"
note = """
pass | revise. `revise` if you found any gap, otherwise `pass`. If the gate
spec itself is wrong, write that as a gap and answer `revise`. Your verdict
does not route the round: the gate's conductor reads every finding and
decides what happens next."""
