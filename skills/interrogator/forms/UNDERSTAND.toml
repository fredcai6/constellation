# Board: understand. Owned by the interrogator skill; seeded into the work
# location at segment entry, worked in place — add rows, resolve, moot with
# reasons. The engine validates at the consolidate transition: an
# open row refuses; a decision answered without the principal's words
# refuses; the escape is deferred: <reason>, journaled.
#
# Blocked is per-row, never per-run: a decision in flight floats up while
# other askable rows proceed.
#
# A row resolves in any style: prose evidence, an artifact in the work
# location, or an excursion's returns. The moves are on the columns below —
# `move` holds the ones worked in place, `excursion` the ones dispatched.
# Reach for an excursion early; reading is not the only move.

imperative = """
Reach common understanding of this ask with your principal, relentlessly,
one question at a time. A row cleared is not the goal; the goal is that you
and your principal would describe the problem in the same words. Ask early
why this issue exists and what it serves in the parent's or epic's purpose --
the spec's chain of purpose is written from these rows. Before you
consolidate, walk the tree: every capability has a use case under it, every
constraint and assumption was tested or confirmed, every answer was asked
what it opened."""

[[question]]
id = "q1"
question = ""
excursion = ""   # the child run that would settle this row now, or
                 # `waived: <one clause>` declining one — a clause, never a
                 # paragraph and never a blank. Three
                 # moves leave the board, one per kind; brief the one you
                 # pick here before you dispatch it: the single question it
                 # answers, what an answer looks like, its budget and its
                 # stop conditions.
                 # prior-art — ask the world. What the literature, the
                 # ecosystem, and this codebase's own history already say.
                 # Primary sources, a citation per claim.
                 # prototype — spike it. Throwaway code, disposed. It
                 # answers the question and never becomes the
                 # implementation.
                 # picture — picture it. A table, a plot, a dump shaped so
                 # the anomaly has nowhere to hide, plus a statement of what
                 # the view cannot show.
                 # Its returns stamp back here. Grounding evidence of every
                 # other kind goes in artifact.
type = ""        # fact | decision | understanding.
                 # fact: you resolve it yourself, with evidence.
                 # decision: a choice the principal owns — never self-answer it.
                 # understanding: the reading you are proceeding on, resolved
                 # only by the principal confirming or correcting it. The
                 # dangerous row is the one you think you already know.
frame = ""       # optional — capability | use-case | event | constraint |
                 # assumption: what the row is about. A use case is how this
                 # changes the way the project is worked, concretely.
move = ""        # how this gets settled without leaving the board: read |
                 # trace | reproduce | evidence-loop — or ask, for a
                 # decision; mirror, for an understanding. An excursion is
                 # not one of these; it has its own column.
                 # read — the code, the journal, the docs say it outright.
                 # trace — follow one concrete input through the system end
                 # to end and write down what happens at each hop.
                 # reproduce — make the break happen on demand before you
                 # reason about it. A break you cannot make happen again is
                 # an open question, not a fact.
                 # evidence-loop — for a break, or for intent and execution
                 # disagreeing: make it happen on demand, then hypothesis →
                 # test until the cause is shown, never guessed. Each cycle
                 # names the hypothesis, the test that would falsify it, and
                 # what the test showed; the loop ends when the cause makes
                 # the break happen.
                 # ask — a decision goes to the principal, one question at a
                 # time; you record their words.
                 # mirror — an understanding goes up as one sentence for the
                 # principal to confirm or correct, verbatim.
from = ""        # optional — the row whose answer raised this one. The tree
                 # you walk for gaps.
cluster = ""     # optional — rows taken to the principal in one sitting
after = []       # optional — row ids this one waits on
status = "open"  # open | answered | moot | up | deferred: <reason>
answer = ""      # fact: the answer and what grounded it — never memory.
                 # decision, understanding: the principal's words, verbatim.
                 # moot: the answer that mooted it.  up: in flight to the
                 # principal, not yet answered.
artifact = ""    # optional — the view, the repro, or the file in the work
                 # location that grounds the answer: grounding evidence of
                 # every kind except an excursion. The child run and its
                 # returns live in excursion.

# Everything below is offered material: the conductor's pre-ask draft, not
# the principal's word. It never belongs at the row's top level, next to
# `answer` — that keeps `answer` the row's one and only binding text,
# unambiguous by structure rather than by whoever typed the row remembering
# the convention. A decision goes to the principal one question at a time,
# carrying `offered.recommend` plus ~3 `offered.option` entries with pros and
# cons. An understanding goes up as a mirror — `offered.recommend` holds the
# reading in one sentence, no options — and the principal confirms or
# corrects it into `answer`. Effort scales with criticality: an obvious row
# in a clustered sitting may carry the recommendation alone. Never surface
# board mechanics — row ids, cluster names, what comes next — to the
# principal. Ask plainly, one complete question per beat.

  [question.offered]
  recommend = ""

    [[question.offered.option]]
    choice = ""
    pros = ""
    cons = ""
