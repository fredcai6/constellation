# Board: understand. Owned by the interrogator skill; seeded into the work
# location at segment entry, worked in place — add rows, resolve, moot with
# reasons, cluster. The engine validates at the consolidate transition: an
# open row refuses; a decision answered without the principal's words
# refuses; the escape is deferred: <reason>, journaled.
#
# A row is askable when nothing in `after` is open and nothing has mooted it.
# Blocked is per-row, never per-run: a decision in flight floats up while
# other askable rows proceed.
#
# A row resolves in any style: prose evidence, an artifact in the work
# location, or a dispatched child's returns. Moves per
# standards/understanding-moves.md — reach for a spike or a data view early;
# reading is not the only move.

[[question]]
id = "q1"
question = ""
type = ""        # fact | decision. A fact you resolve yourself with evidence;
                 # a decision the principal owns — never self-answer it.
move = ""        # how this gets settled: read | trace | reproduce | spike |
                 # picture | evidence-loop — or ask, for a decision.
cluster = ""     # optional — rows taken to the principal in one sitting
after = []       # optional — row ids this one waits on
status = "open"  # open | answered | moot | up | deferred: <reason>
answer = ""      # fact: the answer and what grounded it — never memory.
                 # decision: the principal's words, verbatim.
                 # moot: the answer that mooted it.  up: where it went.
artifact = ""    # optional — the data view, repro, or prototype output in the
                 # work location that grounds the answer. A spike dispatches
                 # the prototyper as a child run; its returns stamp back to
                 # this row.

# A decision goes to the principal one question at a time, carrying ~3 options
# with pros and cons and a recommendation. Effort scales with criticality: an
# obvious row in a clustered sitting may carry the recommendation alone.
# Never surface board mechanics — row ids, cluster names, what comes next —
# to the principal. Ask plainly, one complete question per beat.
recommend = ""

  [[question.option]]
  choice = ""
  pros = ""
  cons = ""
