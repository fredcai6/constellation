# Step: spec. Owned by the spec-writer skill; filled by the spec-writer --
# the conductor's own hat for this one round, distinct from the interrogator
# hat it wears to work the board (`hat`, engine/run.py). The understand
# board is the source; it is not attached. A conductor's `rework` -- ruled
# off the panel's own findings at CONSOLIDATE.toml, the route form the
# segment holds open on either of the panel's own words -- mints this same
# form again, the blocking calls arriving as prefill -- there is no
# rework-form, so a second round is another first cut, not a patch.

imperative = """
Read the understand board whole -- every row, its answer, its settle -- and
crystallize a specification standalone from both: a reader with no tracker
reach and no board must be able to plan from it alone. Fix every high-level
ambiguity the board settled; leave the how to the plan that cuts from this.
Open with the chain of purpose, and make it resolve rather than read: one
rung a line, each an anchor id beside the so-that it carries, from the root
root purpose it terminates at -- an anchor living in one of the documents
`constellation.toml`'s `[roots]` names -- down to what this issue builds. An
anchor is a line holding nothing but a bracketed kebab slug above what it
names: `# [rework-rounds]` above a definition, `<!-- [short-loops] -->` above
a purpose in markdown. A rung's link is one line of `map/parents.jsonl`,
reading `{"id": "<the rung>", "parents": ["<the rung above it>"]}`. Draw the
so-thats from the issue body and the board's own rows on why; never invent
one. The opening of the artifact, not a section. Restate what the issue
asked and what the board settled — point at neither.
Climb one path, not a subtree: the rungs your own obligations need to reach a
root, and nothing beside them. Neighbouring code stays unmapped until a run
touches it -- backfill is a detour on the path you are already walking, never
a cartography project. Where a rung is missing, author it: mint the anchor on
the definition that carries that purpose out -- usually a module docstring,
sometimes one function -- and write its `map/parents.jsonl` line. Never
author a rung no code executes: a chain that reaches a root in two rungs is
complete, and a middle rung invented to pad the climb is the defect, not the
short ladder. Name the anchor id this run's work will land and write its line
now, so the implementer transcribes an id instead of minting one; the line
dangles until that work lands the anchor, which is expected -- nothing
refuses on a dangling entry. A rung you mint sits on code that already
exists, but the id you reserve names a purpose, not the file that will hold
it.
State every obligation this run makes under its own key: a short, stable key
-- say `o-registry-shared`, lowercase words, no sequence number -- that never
changes when the list is edited, so a reference to it survives a rework;
renumbering was how a rework broke the cross-references it was fixing. A plan
round cuts gates against these keys, and each stays checkable only if it is
named and countable, not folded into prose. Every obligation names the
purpose it supports by anchor id: a rung on the ladder above, or the anchor
this run's work will land. An obligation is one of two things: an end state
observable from outside the engine -- a room says this, a journal carries
that entry, an input refuses with this message, a test drives this scenario
-- or an invariant, what stays unchanged and the test that says so. A bar
that is a number carries where it was measured and at what n; a number from a
spike is provisional until re-measured at the size it will be judged at.
Where the code goes and how it is factored is the plan's and the
implementer's, reviewed once in the diff: an obligation naming a function, a
constant or a line is a how wearing a key, and a note about the spec itself
is not an obligation. Fewer obligations that each say something you could
watch happen beat more that say where. Obligations are scaffolding: they live
in `.agent-work/`, gitignored and perishable, and they fall away once the
work lands. The purpose stays, written into the code -- so never cite an
obligation from code, cite the purpose it carried, by anchor id. `engine/`
still carries forty-four comments citing a numbered obligation in a spec that
no longer exists, under a scheme long abandoned; every one sends its reader
nowhere.
Name the boundary too: what this run does not cover -- what the board settled
as out of scope, and the adjacent work a reader would otherwise assume
travels with this one. Obligations say what must be true; the boundary says
where to stop, and a planner that cannot find it cuts gates past it. A spec
that runs past that size names the half that goes back up rather than cutting
gates for it. Consolidate's own key-terms and settle fields are not yours to
fill or restate — this artifact is the whole of your return."""

[[field]]
id = "spec"
kind = "artifact"
note = """
The specification, in the work location (.agent-work/<work-id>/). Point at
it — never retype it: the imperative above says what it must contain."""
