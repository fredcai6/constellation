# Step: spec. Owned by the spec-writer skill; filled by the spec-writer --
# the conductor's own hat for this one round, distinct from the interrogator
# hat it wears to work the board (`hat`, engine/run.py). The understand
# board is the source; it is not attached. A conductor's `rework` -- ruled
# off the panel's own findings at CONSOLIDATE.toml, the route form the
# segment holds open on either of the panel's own words -- mints this same
# form again, the blocking calls arriving as prefill -- there is no
# rework-form, so a second round is another first cut, not a patch.

imperative = """
Read the understand board whole -- every row, its answer, its settle -- and
crystallize a specification standalone from both: a reader with no tracker
reach and no board must be able to plan from it alone. Fix every high-level
ambiguity the board settled; leave the how to the plan that cuts from this.
Open with the chain of purpose: the so-that from the parent's or epic's
purpose down to why this issue exists, and from this issue down to what it
builds. Draw it from the issue body and the board's own rows on why -- never
invent it. Four or five lines, the opening of the artifact, not a section.
Restate what the issue asked and what the board settled — point at neither.
State every obligation this run makes as its own numbered commitment: a plan
round cuts gates against these, and each stays checkable only if it is named
and countable, not folded into prose. A commitment is one of two things: an
end state observable from outside the engine -- a room says this, a journal
carries that entry, an input refuses with this message, a test drives this
scenario -- or an invariant, what stays unchanged and the test that says so.
Where the code goes and how it is factored is the plan's and the
implementer's, reviewed once in the diff: a commitment naming a function, a
constant or a line is a how wearing a number, and a note about the spec
itself is not a commitment. Fewer commitments that each say something you
could watch happen beat more that say where. Name the boundary too: what
this run does not cover -- what the board settled as out of scope, and the
adjacent work a reader would otherwise assume travels with this one.
Commitments say what must be true; the boundary says where to stop, and a
planner that cannot find it cuts gates past it. Consolidate's own key-terms
and settle fields are not yours to fill or restate — this artifact is the whole of your
return."""

[[field]]
id = "spec"
kind = "artifact"
note = """
The specification, in the work location (.agent-work/<work-id>/). Point at
it — never retype it: the imperative above says what it must contain."""
