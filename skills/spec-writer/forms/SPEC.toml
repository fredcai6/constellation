# Step: spec. Owned by the spec-writer skill; filled by the spec-writer --
# the conductor's own hat for this one round, distinct from the interrogator
# hat it wears to work the board (`hat`, engine/run.py). The understand
# board is the source; it is not attached. A revise mints this same form
# again, the panel's findings arriving as prefill -- there is no
# rework-form, so a second round is another first cut, not a patch.

imperative = """
Read the understand board whole -- every row, its answer, its settle -- and
crystallize a specification standalone from both: a reader with no tracker
reach and no board must be able to plan from it alone. Fix every high-level
ambiguity the board settled; leave the how to the plan that cuts from this.
Restate what the issue asked and what the board settled — point at neither.
State every obligation this run makes as its own numbered commitment: a plan
round cuts gates against these, and each stays checkable only if it is named
and countable, not folded into prose. Consolidate's own key-terms and settle
fields are not yours to fill or restate — this artifact is the whole of your
return."""

[[field]]
id = "spec"
kind = "artifact"
note = """
The specification, in the work location (.agent-work/<work-id>/). Point at
it — never retype it: the imperative above says what it must contain."""
