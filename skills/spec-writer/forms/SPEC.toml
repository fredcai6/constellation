# Step: spec. Owned by the spec-writer skill; filled by the spec-writer, a
# separate hand from the conductor. The understand board is the source. The
# conductor's `incorporate` mints this form again holding the panel's
# `findings`; its `rewrite` mints it holding `orders` alone.

imperative = """
State the problem, and stop there. Write one document with four parts, in
this order.

1. The chain of purpose. Open with it. One rung a line: an anchor id and
   the so-that it carries, from a root purpose down to what this issue
   builds. A root is an anchor in one of the documents `constellation.toml`
   lists under `[roots]`. Take each so-that from the issue and the board's
   rows on why; never invent one.

2. The problem. What this run is solving and why that serves the project.
   Read the understand board whole first: every row, its answer, its
   settle. Restate what the issue asked and what the board settled in your
   own words. A reader holding only this document must be able to say what
   is being solved.

3. The obligations. Each is something true when the run is done that
   someone can observe from outside the code: a room says this, an input
   is refused, a report carries that number. Give each a short stable key
   (`o-registry-shared`: lowercase words, no number) and the anchor id of
   the purpose it serves. Do not name a function, a test, a schema or a
   formula: how it is built and proven belongs to the plan and the
   implementer. Prefer few obligations that say what must be true.

4. The boundary. What this run does not cover: what the board settled as
   out of scope, and adjacent work a reader would otherwise assume comes
   with it. A planner that cannot find the boundary cuts gates past it.

Rules for the chain of purpose:

- An anchor is a line holding only a bracketed kebab slug, directly above
  what it names: `# [rework-rounds]` above a definition,
  `<!-- [short-loops] -->` above a purpose in markdown.
- A link is one line of `map/parents.jsonl`:
  `{"id": "<the rung>", "parents": ["<the rung above it>"]}`.
- Climb one path: the rungs your obligations need to reach a root, and
  nothing beside them. Leave neighbouring code unmapped.
- A rung missing on code that already exists: add the anchor on the
  definition that carries that purpose, and write its `map/parents.jsonl`
  line yourself.
- A rung for code this run will write: reserve it in `rungs` below. Do not
  write its `map/parents.jsonl` line; the engine writes it when the work
  lands.
- Never add a rung no code carries out. A chain that reaches a root in two
  rungs is complete.

Obligations live in `.agent-work/` and fall away once the work lands. The
purpose stays, in the code. So code cites a purpose by anchor id, never an
obligation.

Where your orders hold `findings`, this is your one pass over the panel's
review: take what serves the spec, reject what does not, and write the
spec that results. Where they hold `orders` alone, write a fresh spec from
them. The code map (`map/INDEX.md`; `palette:map` builds it where the tree
has none) is where the planner and implementer start; you do not design
for them."""

[[field]]
id = "spec"
kind = "artifact"
note = """
The path of the specification, in the work location
(.agent-work/<work-id>/). Give the path; do not paste the document."""

[[field]]
id = "rungs"
kind = "plan"
optional = true
note = """
One block per anchor this run's work will land on code that does not exist
yet. Naming it here lets the implementer copy the id. Leave the field out
where the run reserves none, which is the usual case."""

  [[field.item]]
  id = "anchor"
  note = "The anchor id this run's work will land, exactly as it will read."

  [[field.item]]
  id = "parents"
  note = "The anchor id or ids it sits under: the rung above it. Space-separated if more than one."
