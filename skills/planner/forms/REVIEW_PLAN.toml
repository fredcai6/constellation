# Step: the planner's review of a queue that closed before all of it ran.
# Owned by the planner skill; filled by the planner. The engine mints this
# form in place of PLAN.toml when a queued gate's proof already passes, a
# critical question came back different, or a gate was reminted or dropped
# with later gates still queued. No panel reads what this round returns.
# The shared fields are PLAN.toml's (`same-as`).

imperative = """
The queue closed before the rest of it ran. Your orders say why:

- `stale`: the reason. A gate was reminted or dropped, a critical question
  came back different from what the plan expected, or the next gate's
  proof already passes or could not run.
- `closed-queue`: every gate block the queue still held, in order, as the
  plan wrote it.
- `taught` and `findings`: what the conductor saw the last gate show, and
  what it took from that for the plan. Treat them as ground to build on,
  not as objections to answer.

1. Before you cut, work out what this says about the plan. What did it
   assume that turned out false? Which remaining gates rest on the same
   assumption? Open the code that decides it. For a proof that already
   passes, find what made it true.

2. Cut what the run still needs, to the same bar as any cut: every gate
   whose path is clear, each one complete proof of one thing. Nothing in
   `closed-queue` carries over on its own. A block you want to keep you
   write again here, checked against what the run now knows.

3. Update the call-tree in your orders against the code as it stands.

4. Write the plan document so it states what the run knows now and reads
   whole to someone who saw no earlier plan.

If the open obligations are already met and nothing is left to cut, do not
submit an empty cut. Run `spine <work-id> note blocked "<which obligation,
and what shows it is met>"` and end your turn: the conductor settles it."""

[[field]]
id = "plan"
kind = "artifact"
note = """
The path of the plan document this round wrote, in this run's work
location (.agent-work/<work-id>/). Give the path; do not paste the
document."""

[[field]]
id = "call-tree"
same-as = "skills/planner/forms/PLAN.toml"

[[field]]
id = "key-terms"
same-as = "skills/planner/forms/PLAN.toml"

[[field]]
id = "critical-questions"
same-as = "skills/planner/forms/PLAN.toml"

# Written last: see PLAN.toml's own note on why a block list comes last.
[[field]]
id = "gates"
same-as = "skills/planner/forms/PLAN.toml"
