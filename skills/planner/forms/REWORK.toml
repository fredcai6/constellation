# Step: the planner's one pass over its review. Owned by the planner skill;
# filled by the planner. The conductor's `incorporate` mints this form in
# place of PLAN.toml, the panel's findings as prefill (`[one-look]`,
# engine/cli.py); the cut it returns is released with no second panel.

imperative = """
The panel has read your cut, and its findings are in your prefill, with any
orders the conductor wrote ahead of them. They are advice: take each one
that makes this a better next step, reject each one that does not, and
record which in `findings-addressed`. Then cut the gate that results -- the
same bar as the first cut: the next chunk toward the spec's done, small,
with purpose saying what the run takes as true, proof what verifies it,
scope where. The how is the implementer's, so a finding about how is one
you can reject on that bar alone. Delete the restated. No panel reads this
cut again: the conductor releases it, and the gate's own reviewers read the
diff.
The plan document itself carries the approach and the risks that would
change it; this gate's purpose, scope and proof are the fields below, not
restated there."""

[[field]]
id = "plan"
kind = "artifact"
note = """
The plan document this round edited, in this run's work location
(.agent-work/<work-id>/): this segment's own, never one an earlier plan
segment left behind describing a different gate. Point at it, never retype
it -- the imperative above says what belongs in it. A round that changed only
the fields below and wrote no document of its own says `waived: fields only`
rather than naming the last true path another round wrote."""

[[field]]
id = "purpose"
note = "What this gate accomplishes, and why the plan needs it."

[[field]]
id = "scope"
note = "Where the change lives, and what is out of bounds."

[[field]]
id = "proof"
kind = "proof"
note = """
Same as PLAN.toml's `proof`: the exact command to run, never a description,
referencing the command palette (constellation.toml) -- one that proves
nothing on an empty diff or a diff short of `scope`. What must be true when
the issue ends: run at submit, when the gate lands, and again at close."""

[[field]]
id = "gate-proof"
kind = "proof"
optional = true
note = """
Same as PLAN.toml's `gate-proof`: what must be true when this gate lands
alone, run at submit and when the gate lands, never at close. Or waived:
none."""

[[field]]
id = "budget"
optional = true
note = """
Same as PLAN.toml's `budget`: declare one only for a proof that is right and
may run past the engine's 600 seconds. Whole seconds, a bare integer."""

[[field]]
id = "model"
optional = true
note = "Tier override for this gate: light | standard | heavy. Omit for the assembly default."

[[field]]
id = "direction"
optional = true
note = """
A question this gate is expected to answer for the next plan round, when you
have one. The gate's own close form is asked to answer it in `residue`, so
write something answerable or leave it out -- `waived: none` is the ordinary
case for a run's last gate. Not a place for anything else you noticed:
something outside this gate's own scope is the conductor's to call
`rejected: <reason>` at the review that follows, and the shape of the gates
after this one is `horizon`."""

[[field]]
id = "horizon"
kind = "evidence"
note = """
The gates likely to follow this one, coarsely, and the conditions that would
change them. Provisional by construction: read beside the gate above by
whoever judges this round, but never attacked at gate grain, and never
carried into the implementer's own prefill -- the gate ahead is this one
alone."""

[[field]]
id = "findings-addressed"
kind = "evidence"
record-only = true
note = """
Each finding taken, naming the edit, or rejected, with the reason. A
ledger, not a narrative.

This is for the record and the conductor, never for the next critic — it
stays out of a panelist's prefill, because a reviewer told what was wrong
last time is aimed at those spots and steered off everything else."""

[[field]]
id = "deleted"
kind = "evidence"
record-only = true
note = """
What came out of the plan this pass, and why each cut was safe. Cutting
meaning to make it smaller is the failure this field exists to catch, not
the behaviour it asks for.
For the record and the conductor, never the next critic — it stays out of a
panelist's prefill."""

[[field]]
id = "key-terms"
kind = "evidence"
note = "This work's load-bearing terms; each cites its glossary entry or proposes a new one. Coining a synonym is a defect."
