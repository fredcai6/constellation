# Step: the planner's one pass over its review. Owned by the planner skill;
# filled by the planner. The conductor's `incorporate` mints this form in
# place of PLAN.toml, with the panel's findings as prefill. The cut it
# returns is released with no second panel. The shared fields are
# PLAN.toml's (`same-as`).

imperative = """
The panel has read your cut. Its findings are in your orders, after any
orders the conductor wrote.

1. Decide each finding. The findings are advice: take each one that makes
   a better next step and reject each one that does not. A finding about
   how a gate gets built is the implementer's business, and you can reject
   it for that alone. Record every decision in `findings-addressed`.

2. Cut the gates that result, to the same bar as the first cut: every gate
   whose path is clear, each one complete proof of one thing, each with a
   proof that fails now and names the tests that gate adds.

3. Update the plan document. Delete what it restates.

No panel reads this cut again. The conductor releases it, and each gate's
own reviewers read its diff."""

[[field]]
id = "plan"
kind = "artifact"
note = """
The path of the plan document this round edited, in this run's work
location (.agent-work/<work-id>/). It is this round's own document, never
one an earlier plan round left behind. Give the path; do not paste the
document. A round that changed only the fields below answers
`waived: fields only`."""

[[field]]
id = "call-tree"
same-as = "skills/planner/forms/PLAN.toml"

[[field]]
id = "findings-addressed"
kind = "evidence"
record-only = true
note = """
One line per finding: taken, naming the edit, or rejected, with the
reason. This is for the record and the conductor. It is never shown to a
later reviewer."""

[[field]]
id = "deleted"
kind = "evidence"
record-only = true
note = """
What came out of the plan this pass, and why each removal was safe.
Removing meaning to make the plan shorter is the failure this field is
here to catch. For the record and the conductor; never shown to a later
reviewer. `waived: none` where nothing came out."""

[[field]]
id = "key-terms"
same-as = "skills/planner/forms/PLAN.toml"

[[field]]
id = "critical-questions"
same-as = "skills/planner/forms/PLAN.toml"

# Written last: see PLAN.toml's own note on why a block list comes last.
[[field]]
id = "gates"
same-as = "skills/planner/forms/PLAN.toml"
