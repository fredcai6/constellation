# Step: rework round of plan. Owned by the planner skill; filled by the planner.
# A revise verdict mints this form in place of PLAN.toml; the panel's merged
# findings arrive as prefill.

imperative = """
Work the findings into the plan and the gate spec both. Delete the restated.
Move accepted detail into the gate's latitude. Replace a twice-patched proof
in kind. A round that grew because its gates gained proofs is not the round
that grew because a settled argument came back. Say which this was, in
`deleted`. Purpose says the result, proof says what verifies it, scope says
where -- the how is the implementer's, and that is the bar a finding is held
to. The plan document itself carries the approach and the risks that would
change it; this gate's purpose, scope and proof are the fields below, not
restated there."""

[[field]]
id = "plan"
kind = "artifact"
note = """
The plan document this round edited, in this run's work location
(.agent-work/<work-id>/): this segment's own, never one an earlier plan
segment left behind describing a different gate. Point at it, never retype
it -- the imperative above says what belongs in it. A round that changed only
the fields below and wrote no document of its own says `waived: fields only`
rather than naming the last true path another round wrote."""

[[field]]
id = "purpose"
note = "What this gate accomplishes, and why the plan needs it."

[[field]]
id = "scope"
note = "Where the change lives, and what is out of bounds."

[[field]]
id = "proof"
note = """
Same as PLAN.toml's `proof`: the exact command to run, never a description,
referencing the command palette (constellation.toml) -- one that proves
nothing on an empty diff or a diff short of `scope`."""

[[field]]
id = "budget"
optional = true
note = """
Same as PLAN.toml's `budget`: declare one only when the proof is long because
it is right. Whole seconds, a bare integer -- not a paragraph of rationale."""

[[field]]
id = "model"
optional = true
note = "Tier override for this gate: light | standard | heavy. Omit for the assembly default."

[[field]]
id = "direction"
optional = true
note = """
A question this gate is expected to answer for the next plan round, when you
have one. The gate's own close form is asked to answer it in `residue`, so
write something answerable or leave it out -- `waived: none` is the ordinary
case for a run's last gate. Not a place for anything else you noticed: a
candidate for later is the conductor's `beyond` at the review that follows,
and the shape of the gates after this one is `horizon`."""

[[field]]
id = "horizon"
kind = "evidence"
note = """
The gates likely to follow this one, coarsely, and the conditions that would
change them. Provisional by construction: read by the critics alongside the
gate above, but never attacked at gate grain, and never carried into the
implementer's own prefill -- the gate ahead is this one alone."""

[[field]]
id = "findings-addressed"
kind = "evidence"
record-only = true
note = """
Rework only, and only the round just past: each finding accepted, naming the
edit, or contested, with the reason. A ledger, not a narrative.

This is for the record and the conductor, never for the next critic — it
stays out of a panelist's prefill, because a reviewer told what was wrong
last time is aimed at those spots and steered off everything else. First
pass: waived: first pass."""

[[field]]
id = "deleted"
kind = "evidence"
record-only = true
note = """
What came out of the plan this round, and why each cut was safe, and which of
this round's growth was the work getting more checkable and which was
argument returning. Cutting meaning to make it smaller is the failure this
field exists to catch, not the behaviour it asks for.
For the record and the conductor, never the next critic — it stays out of a
panelist's prefill."""

[[field]]
id = "key-terms"
kind = "evidence"
note = "This work's load-bearing terms; each cites its glossary entry or proposes a new one. Coining a synonym is a defect."
