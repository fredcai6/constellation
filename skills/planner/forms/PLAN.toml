# Step: plan. Owned by the planner skill; filled by the planner.
# The consolidate's spec and key terms arrive as prefill. An `incorporate`
# mints REWORK.toml for the next round, so this form is always a first cut --
# including every later time it is minted: after a gate lands, the next
# chunk is cut here; a `replan` outcome closes the pending gates and recuts
# the plan here, and what the gate that forced it learned arrives as
# `findings` -- the ground the new cut answers to, not an objection to rebut;
# and a `rewrite` recuts it from the conductor's `orders` alone.

imperative = """
Choose the next chunk of work toward the spec's done, and cut it as one
gate: purpose, scope, proof, and, when you know them, a model override and
a direction for what it should teach. A chunk is a vertical, complete
proof of one thing: what the run can take as true once it lands, built end
to end and verified on its own. Work that can only be verified together
belongs in one chunk, and every gate pays a full plan, panel and review
round before its first line of code, so cut the chunk as whole as one diff
a reviewer can run and read allows. The engine reopens this segment after
every gate while an obligation stays open, and each cut is chosen from the
spec and the tree as they stand -- what has landed since the run began
arrives as `landed`. Where your prefill holds a `horizon`, it is what the
last cut was thinking about the road ahead: check it against the code as
it stands, make its next chunk specific enough to be this gate, and update
what follows with what the run has learned -- or pivot, where what landed
says the road has changed. Start at the
code map (`map/INDEX.md`; `palette:map` builds it where the tree has none)
and read the code it points you to. Purpose says what the run takes as true
once this gate lands, proof says what verifies it, scope says where, at
the grain of modules and seams -- the how is the implementer's, who reads
the same code and chooses it there. `standards/approach.md`, under the
engine root the brief named, is what this project builds by; name in
`purpose` which of its five this gate serves. Then lay out the horizon
behind it, coarsely: the order the spec's remaining requirements will be
met in, and which belong together. The plan
document itself carries the approach and the risks that would change it,
and stands on its own: the panel reads it cold, with the spec and the run's
state beside it and no earlier plan. This gate's purpose, scope and proofs
are the fields below, not restated there. Where your prefill holds `orders`
alone, the last cut is gone: cut fresh from the orders, as a first cut."""

[[field]]
id = "plan"
kind = "artifact"
note = """
The plan document, in this run's work location (.agent-work/<work-id>/).
Point at it — never retype it: the imperative above says what belongs in
it and what stays here instead."""

[[field]]
id = "purpose"
note = """
What later gates and the run's conclusion will take as true once this gate
lands -- a claim someone could test, not a summary of what changed. Second,
which of the five in `standards/approach.md` it serves."""

[[field]]
id = "scope"
note = "Where the change lives, and what is out of bounds."

[[field]]
id = "proof"
kind = "proof"
note = """
A command that passes on an empty diff proves nothing, and so does one that
covers less than `scope` promised. It exercises purpose's claim: a proof that passes while purpose is false has proved
the wrong thing. Write the exact string to run, never a description of it:
this field rides into the dispatched child as its own `proof`, shell-executed
there. This is what must be true when the issue ends. It runs at your
submit, against the run's tree as it stands, where whoever judges the cut
reads the result beside it: a real check fails there, before the work; one
that passes proves nothing; prose does not resolve. It runs again when the
gate lands, and once more when the run closes, against the finished tree
after every later gate has landed. Reference the command palette
(constellation.toml) rather than hardcoding where it applies."""

[[field]]
id = "gate-proof"
kind = "proof"
optional = true
note = """
What must be true when this gate lands, and need not hold after later gates
have: what the gate left alone -- nothing else changed, a file identical to
the cut. The exact command, like `proof`; it runs at your submit and when
the gate lands, never at close. Or waived: none."""

[[field]]
id = "budget"
optional = true
note = """
Seconds past which the proof counts as hung rather than slow. The engine
allows 600 already, so declare one only for a proof that is right and may
take longer than that -- a full suite on a busy host, a real build. Whole
seconds, a bare integer -- not a paragraph of rationale."""

[[field]]
id = "model"
optional = true
note = "Tier override for this gate: light | standard | heavy. Omit for the assembly default."

[[field]]
id = "direction"
optional = true
note = """
A question this gate is expected to answer for the next plan round, when you
have one. The gate's own close form is asked to answer it in `residue`, so
write something answerable or leave it out -- `waived: none` is the ordinary
case for a run's last gate. Not a place for anything else you noticed:
something outside this gate's own scope is the conductor's to call
`rejected: <reason>` at the review that follows, and the shape of the gates
after this one is `horizon`."""

[[field]]
id = "horizon"
kind = "evidence"
note = """
The road after this gate: the order the spec's remaining requirements will
be met in, and which belong in one chunk. Coarse by design -- a detail you
can already give belongs in this gate, or is not known yet. The next cut's
planner receives it as what this cut was thinking, and the plan document's
own account of earlier gates stays behind. Read beside the gate above by
whoever judges this round, but never attacked at gate grain, and never
carried into the implementer's own prefill -- the gate ahead is this one
alone."""

[[field]]
id = "key-terms"
kind = "evidence"
note = "This work's load-bearing terms; each cites its glossary entry or proposes a new one. Coining a synonym is a defect."
