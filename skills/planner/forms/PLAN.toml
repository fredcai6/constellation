# Step: plan. Owned by the planner skill; filled by the planner.
# The consolidate's spec and key terms arrive as prefill. A revise
# mints REWORK.toml for the next round, so this form is always a first cut --
# including the second time it is minted: a `replan` outcome closes the
# pending gates and recuts the plan here, and what the gate that forced it
# learned arrives as `findings`. Those are the ground the new cut answers to,
# not an objection to rebut.

imperative = """
Cut the gate that lands the spec: purpose, scope, proof, and, when you know
them, a model override and a direction for what it should teach. One gate is
the default, and a plan that cuts more than one argues the split: a second
gate earns its place only where one diff would be unreviewable, or where the
second piece needs a ruling from the first's evidence. Work that is merely
sequential is one gate; each gate buys its own review rounds, and that is the
cost a split has to beat. Purpose says the result,
proof says what verifies it, scope says where -- the how is the
implementer's, and that is the bar this gate is held to. A fresh-context
critic must be able to attack it from the spec and the plan alone, and a
fresh-context implementer must be able to execute it from the gate spec
alone. `standards/approach.md` is what this project builds by; name in
`purpose` which of its five this gate serves, and cut the gate that serves it
and nothing beside it. Sketch the horizon behind it -- coarsely, and only as
far as you can actually commit to before the ground shifts. The plan document itself
carries the approach and the risks that would change it; this gate's
purpose, scope and proof are the fields below, not restated there."""

[[field]]
id = "plan"
kind = "artifact"
note = """
The plan document, in this run's work location (.agent-work/<work-id>/).
Point at it — never retype it: the imperative above says what belongs in
it and what stays here instead."""

[[field]]
id = "purpose"
note = "What this gate accomplishes, and why the plan needs it."

[[field]]
id = "scope"
note = "Where the change lives, and what is out of bounds."

[[field]]
id = "proof"
note = """
A command that passes on an empty diff proves nothing, and so does one that
covers less than `scope` promised -- one check per commitment. Write the
exact string to run, never a description of it: this field rides into the
dispatched child as its own `proof`, shell-executed there, so prose becomes a
command and fails only after the work is done. Reference the command palette
(constellation.toml) rather than hardcoding where it applies."""

[[field]]
id = "budget"
optional = true
note = """
Declare one when the proof is long because it is right -- a full suite, a
real build -- so a check that outruns it is news rather than the normal
case. Whole seconds, a bare integer -- not a paragraph of rationale."""

[[field]]
id = "model"
optional = true
note = "Tier override for this gate: light | standard | heavy. Omit for the assembly default."

[[field]]
id = "direction"
optional = true
note = """
A question this gate is expected to answer for the next plan round, when you
have one. The gate's own close form is asked to answer it in `residue`, so
write something answerable or leave it out -- `waived: none` is the ordinary
case for a run's last gate. Not a place for anything else you noticed: a
candidate for later is the conductor's `beyond` at the review that follows,
and the shape of the gates after this one is `horizon`."""

[[field]]
id = "horizon"
kind = "evidence"
note = """
The gates likely to follow this one, coarsely, and the conditions that would
change them. Provisional by construction: read by the critics alongside the
gate above, but never attacked at gate grain, and never carried into the
implementer's own prefill -- the gate ahead is this one alone."""

[[field]]
id = "key-terms"
kind = "evidence"
note = "This work's load-bearing terms; each cites its glossary entry or proposes a new one. Coining a synonym is a defect."
