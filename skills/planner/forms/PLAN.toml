# Step: plan. Owned by the planner skill; filled by the planner.
# The spec, the open obligations and what has landed arrive as prefill. This
# form is always a first cut: the run's opening cut, the next cut once a
# queue runs dry, a `replan`, or a `rewrite` from the conductor's `orders`.
# REWORK.toml and REVIEW_PLAN.toml take the fields below from this file
# (`same-as`), so a field is worded once.

imperative = """
Cut the next gates toward the spec's done.

1. Read first. Start at the code map (`map/INDEX.md`; `palette:map` builds
   it where the tree has none), then read the code it points to. Your
   orders hold the spec, the obligations still open, and `landed`: what has
   landed since the run began. After a `replan` they also hold `findings`:
   what the last gate taught. Build on it; it is not an objection to answer.

2. Cut every gate whose path you can see clearly, in the order they run:
   at least one, and up to the whole run. A gate is one complete, vertical
   proof of one thing: built end to end and verified on its own. Work that
   can only be verified together goes in one gate. Make each gate as whole
   as one diff a reviewer can run and read.

3. Stop the queue where the path stops being clear. Say in
   `critical-questions` what you cannot yet see and which gate will answer
   it. A cut that ends early is correct, not a failure: the engine asks for
   the next cut once the queue is empty.

4. Give every gate a proof that fails now and passes only once that gate's
   own work is done. A later gate's proof must still fail after the gates
   ahead of it land, so it names tests that gate adds: its own new test
   file, or its own test ids. The engine closes a queued gate whose proof
   already passes.

5. Write the call-tree for the whole run, with each gate's nodes marked.
   Where your orders hold a `call-tree`, it is the last cut's: check its
   nodes against the code as it stands and update it, or replace it where
   what landed changed the structure.

6. Write the plan document: the approach, and the risks that would change
   it. It stands alone. A panel reads it cold beside the spec, with no
   earlier plan. Each gate's purpose, scope and proof go in its `gates`
   block, not in the document.

How each gate gets built is the implementer's choice, made reading the same
code. Where your orders hold `orders` alone, the last cut is gone: cut
fresh from them.

If the open obligations are already met and nothing is left to cut, do not
submit an empty cut. Run `spine <work-id> note blocked "<which obligation,
and what shows it is met>"` and end your turn: the conductor settles it."""

[[field]]
id = "plan"
kind = "artifact"
note = """
The path of the plan document, in this run's work location
(.agent-work/<work-id>/). Give the path; do not paste the document."""

[[field]]
id = "call-tree"
kind = "evidence"
note = """
An outline of what the spec's done needs, one node per function or module.
Write it as indented lines; it is shown to every later reader exactly as
you write it.

For each node: what it owns (the state or decision hidden inside it), what
it receives, what it returns, and who calls it. Mark each node one of:

  landed      already in the tree. Its name alone is enough.
  THIS GATE   built by a gate in this cut. Where the cut has several
              gates, say which by its position: `THIS GATE (g2)`. Give
              the full signature and the results the proof checks.
  ahead       later work. Keep it coarse; it may merge or move.

Go down far enough that an implementer could build each THIS GATE node
against a testable contract, then stop: what is inside a node is the
implementer's. The implementer owns its THIS GATE nodes and raises a
change to an edge another node relies on as a blocked note.
`waived: none` for a cut that is one function."""

[[field]]
id = "key-terms"
kind = "evidence"
note = """
The terms this work depends on. Each one cites its glossary entry or
proposes a new entry. Do not coin a synonym for a term that has one."""

[[field]]
id = "critical-questions"
kind = "plan"
optional = true
note = """
One block per question this cut cannot yet see past. The queue ends at the
first gate whose work depends on an unanswered one. When the answering
gate lands, the conductor rules whether its answer matched what you
expected; a different answer sends this plan back to you for one review.
Leave the field out where this cut reaches the whole run."""

  [[field.item]]
  id = "question"
  note = "What the cut cannot yet see past this point in the queue."

  [[field.item]]
  id = "gate"
  note = """
Which gate of this cut is expected to answer it, by its position: g1, g2.
Never a guessed engine id."""

  [[field.item]]
  id = "expected-answer"
  note = "The answer this cut expects that gate to find."

# Written last: a `kind = "plan"` field renders as a bare `[[gates]]` header,
# and TOML nests every scalar written after it into that array's last block.
# tests/test_reachable_briefs.py holds every form to this.
[[field]]
id = "gates"
kind = "plan"
note = """
One block per gate, in the order they run. At least one. Releasing the cut
queues every block: once the first gate is accepted, the next starts with
no new plan round and no panel, until the queue is empty or a queued
gate's proof already passes."""

  [[field.item]]
  id = "purpose"
  note = """
What the rest of the run can take as true once this gate lands. Write a
claim someone could test, not a summary of the change. Then name which of
the five in `standards/approach.md` it serves."""

  [[field.item]]
  id = "scope"
  note = "Where the change lives, and what is out of bounds."

  [[field.item]]
  id = "proof"
  kind = "proof"
  note = """
The exact command that shows `purpose` is true. Write the command itself,
never a description: the engine runs this string through the shell.

- It fails now, before the work. A command that passes on an empty diff
  proves nothing.
- It exercises the claim in `purpose` and covers what `scope` promised.
- A later gate's proof names tests that gate adds (its own new test file,
  or its own test ids), so it still fails after the gates ahead of it land.
- Name a palette entry where one applies: `palette:test tests/x.py`.

The engine runs it when you submit and prints what it did, runs it again
when the gate lands, and once more when the run closes."""

  [[field.item]]
  id = "gate-proof"
  kind = "proof"
  optional = true
  note = """
A file or module this gate must leave untouched, as a command:
`git diff --quiet "${CONSTELLATION_GATE_BASE:?}" -- <paths>`. The engine
sets the base to the last landed gate's commit. Name only what must stay
untouched and why the plan needs it still. Most gates have none: answer
`waived: none`, because the implementer chooses what the work touches and
review reads the diff. Runs when you submit and when the gate lands, never
at close."""

  [[field.item]]
  id = "budget"
  optional = true
  note = """
Seconds the proof may run before it counts as hung. The engine allows 600.
Declare more only for a proof that is right and slower than that. A whole
number, nothing else."""

  [[field.item]]
  id = "model"
  optional = true
  note = """
Tier override for this gate: light, standard or heavy. Leave it out for
the default. If you set one, say why in `direction`."""

  [[field.item]]
  id = "direction"
  optional = true
  note = """
One question this gate should answer for the next plan round. The gate
answers it at its close, so write something answerable. Leave it out where
there is none. Nothing else goes here."""
