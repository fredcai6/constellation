# Step: implement. Owned by the implementer skill; identical in any assembly.
# The gate spec (purpose, scope, proof) arrives as prefill and is the order.

imperative = """
Make the change the gate spec in your orders describes.

- Where your orders hold a `call-tree`, the nodes marked THIS GATE for
  this gate are yours to build. The other nodes show what calls yours and
  what yours call. Build to the contracts at the edges; the inside of your
  nodes is yours to shape.
- You may make one change the spec did not name when all three hold: it is
  in a file this gate already touches, it needs no proof of its own, and
  reverting it alone would leave the gate's diff complete. Declare it in
  `deviations`.
- Do not commit. Your deliverable is the working tree as you leave it. The
  engine makes this gate's commit when the gate is accepted.
- The engine runs the gate's proof when you submit, so run it yourself
  first. Your orders print the exact command beside `proof`.

Where the spec's wording and its proof read differently and one change
satisfies both, the proof decides: build what makes it pass, and say so in
`deviations`.

Raise a block only when you cannot go on: the proof cannot pass while the
spec is followed, the gate is the wrong thing to build, or your change
would alter an edge another node relies on. Do not improvise around it.
Run `spine <work-id> note blocked "<the question>"` and end your turn."""

[[field]]
id = "change"
kind = "evidence"
note = """
What changed and why it makes the gate's `purpose` true. Describe the
shape of the diff, not the effort."""

[[field]]
id = "deviations"
kind = "evidence"
note = """
Every change this round made that the spec did not name, one line each
with its file, and every place the work departed from the spec, with the
reason. The gate's conductor rules on each one. `waived: none` where there
are none."""

[[field]]
id = "proof"
kind = "check"
note = """
The gate spec's proof command; the engine runs it at submit and appends the
output. Never part of the response template. A proof that outruns the gate
budget (600 seconds, or the gate spec's longer `budget`) is refused; one
still running after 90 seconds hands your turn back and journals the submit
itself when it passes, so `spine <work-id>` is where you find out."""

[[field]]
id = "gate-proof"
kind = "check"
note = """
The gate spec's `gate-proof`, where it has one: what must be true as this
gate lands, run beside `proof` the same way. Never part of the response
template."""
