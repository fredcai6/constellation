# Step: implement. Owned by the implementer skill; identical in any assembly.
# The gate spec (purpose, scope, proof) arrives as prefill and renders above
# these fields in status. It is the order: contest it with a blocked note up,
# never by editing it.

imperative = """
Make the change the gate spec above describes. You may also make one the spec
did not name when all three hold: it is in a file this gate already touches,
it needs no proof of its own, and it is separable -- reverting it alone would
leave the gate's diff complete. Anything failing one of the three is a note,
never a detour. When the spec and reality disagree, that is a blocked note up,
not an improvisation.

Your deliverable is the working tree as you leave it, uncommitted. The issue
tier makes this gate's commit when the parent advances past it, from whatever
is standing in the tree then -- so a change you commit yourself lands in some
other commit than the gate's, and the gate's own diff is no longer the whole
of what it did."""

[[field]]
id = "change"
kind = "evidence"
note = "What changed and why it satisfies the purpose — the shape of the diff, not a narration of effort."

[[field]]
id = "deviations"
kind = "evidence"
note = """
Every change this round made that the spec did not name -- one line each,
naming its file -- and where the work departed from the spec and why. Or
waived: none. The gate-conductor calls each of these at `route` the way it
calls a review finding, so one left undeclared is one nobody ruled on."""

[[field]]
id = "proof"
kind = "check"
note = """
The gate spec's proof command; the engine runs it at submit and appends the
output. Never part of the response template. A proof that outruns the gate
budget (600 seconds, or the gate spec's longer `budget`) is refused; one
still running after 90 seconds hands your turn back and journals the submit
itself when it passes, so `spine <work-id>` is where you find out."""

[[field]]
id = "gate-proof"
kind = "check"
note = """
The gate spec's `gate-proof`, where it has one: what must be true as this
gate lands, run beside `proof` the same way. Never part of the response
template."""
