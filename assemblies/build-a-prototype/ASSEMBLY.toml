# Assembly: one prototype excursion. Opened from a board row or a plan step;
# the brief is the opening prefill. One terminal step -- the return is the
# whole run.

assembly = "build-a-prototype"
conductor = "excursion"

[[segment]]
id = "return"

[segment.transition]
anchor = true
terminal = true
form = "skills/excursion/forms/PROTOTYPE.toml"
filler = "excursion"
