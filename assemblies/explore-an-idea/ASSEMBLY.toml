# Assembly: explore one idea into a spec, with a live human. The skeleton is
# fixed; the ideas board is worked across cycles, and each cycle is one
# firing of the explore transition. No delegated posture: the conductor
# always has a human in reach.

assembly = "explore-an-idea"
conductor = "explorer"

[[segment]]
id = "open"

[segment.transition]
anchor = true
form = "forms/OPEN.toml"
filler = "conductor"

[[segment]]
id = "explore"
interior = "board"
board = "skills/explorer/forms/IDEAS.toml"
worker = "explorer"

[segment.transition]
anchor = true
form = "forms/CYCLE.toml"
filler = "conductor"
decides = "decision"

  [[segment.transition.outcome]]
  value = "cycle"
  does = "refill"        # this transition minted again; the board untouched

  [[segment.transition.outcome]]
  value = "converge"
  does = "release"

  [[segment.transition.outcome]]
  value = "shelve"
  does = "skip spec"     # past spec to close; the skip is loud, spec is anchored

[[segment]]
id = "spec"
interior = "steps"
step-form = "forms/SPEC.toml"
# A revise mints this in place of the step-form. No impasse outlet: every
# disposition here is the human's, so a fourth round is already their call.
rework-form = "forms/REWORK.toml"
worker = "conductor"
decides = "next"       # REWORK.toml's; SPEC.toml has no such field

  [[segment.outcome]]
  value = "resubmit"
  does = "release"

  [[segment.outcome]]
  value = "re-explore"
  does = "skip spec; refill spec; refill explore"   # back to the board; a fresh first cut waits behind the next converge

[segment.transition]
anchor = true
# No conductor form: pass releases to close, revise refills with the
# findings. There is no third verdict word, and this segment declares no
# impasse outlet either (see above) -- a root objection is a revise finding,
# and a fourth round on it is already the human's own call. A spec is judged
# on different criteria from a plan -- the form is the same fresh-context
# critic, the criteria are this assembly's.
decides = "verdict"     # the panel's own merged verdict; no conductor form submits it

  [[segment.transition.outcome]]
  value = "pass"
  does = "release"     # mints nothing; the run walks past spec on its own

  [[segment.transition.outcome]]
  value = "revise"
  does = "rework"     # another spec round, through REWORK.toml, findings as prefill

  # One criterion per panelist, as run-an-issue's plan transition: three fresh-context
  # readers disagreeing is a panel; one reader holding three criteria is a
  # reviewer with a checklist.

  [[segment.transition.panel]]
  form = "skills/critic/forms/CRITIC.toml"
  worker = "critic"
  model = "standard"
  criteria = "completeness: is every high-level ambiguity resolved -- could two readers cut different issues from this spec"

  [[segment.transition.panel]]
  form = "skills/critic/forms/CRITIC.toml"
  worker = "critic"
  model = "standard"
  criteria = "restraint: does it fix the shape and leave implementation to the issues it cuts -- name every line that decides below the issue grain"

  [[segment.transition.panel]]
  form = "skills/critic/forms/CRITIC.toml"
  worker = "critic"
  model = "standard"
  criteria = "simplicity: does this shape solve the problem at its root, or add a guard, special case or second path beside what already exists? A root fix that costs more lines beats a guard that costs fewer -- simple means simple to understand, not the smaller version. Name what should go through an existing thing instead of beside it"

[[segment]]
id = "close"

[segment.transition]
anchor = true
terminal = true
form = "forms/CLOSE.toml"
filler = "conductor"
