# Anchor: close, terminal. Owned by explore-an-idea; filled by the conductor.
# Everything on this form returns when this run is parented. The engine
# appends the mechanical record itself: the cycles fired, the excursions
# run, the panel's verdicts, and this run's amend summary.

imperative = """
Close the exploration. Record where the design went and the human's words
sending it there — the record is the gate; nothing downstream refuses."""

[[field]]
id = "confirmed"
kind = "decision"
note = "The human's confirmation of the spec, verbatim — or shelved: <their reason>."

[[field]]
id = "routed"
kind = "evidence"
note = "Where it went: the epic or issue refs cut from it, or the shelved spec's location with its board beside it."

[[field]]
id = "residue"
kind = "evidence"
note = "What whoever picks this up should know that no recorded field carries — or waived: none."
