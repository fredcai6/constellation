# Assembly: one panelist's verdict. Opened by a transition's panel, one
# child per panelist -- the artifact under review and the panelist's own
# criteria arrive as prefill. A single anchored, terminal step: there is
# nothing here but the verdict, so review never grows an interior of its own.

assembly = "give-a-verdict"
conductor = "reviewer"

[[segment]]
id = "verdict"
# [verdict-step-form]
# Rationale: `_up_target`'s backward scan (engine/cli.py) resolves a bare
#   `up` only at a segment declaring `step-form` -- without this, a
#   panelist mid-verdict had nowhere at or before its own segment to
#   resume, and `up` refused outright. `verdict` declares no `interior`,
#   so `skeleton()`'s own gate (`seg.get("interior") in ("steps",
#   "board")`) stays false and this changes nothing about what `open`
#   mints -- only `_up_target`'s scan sees it.
step-form = "skills/reviewer/forms/REVIEW.toml"

[segment.transition]
anchor = true
terminal = true
form = "skills/reviewer/forms/REVIEW.toml"
filler = "reviewer"
