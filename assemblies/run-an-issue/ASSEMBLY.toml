# Assembly: run one issue end to end. The skeleton is fixed; interiors are
# worked. Everything is a segment: an anchor step is a segment with no
# interior, only its transition. Default model tiers per segment; a gate spec
# may override its own.

assembly = "run-an-issue"
conductor = "issue-conductor"

[[segment]]
id = "open"

[segment.transition]
anchor = true
form = "forms/OPEN.toml"
filler = "conductor"
# `issue` and `authority` join the run's prefill so every later dispatch gets
# them: authority is the principal's own orders, and a gate child that never
# sees them is working for nobody. `questions` is left out on purpose -- the
# board supersedes the seeds the moment it is worked, and a frozen copy of
# them in a child's prefill reads as orders it is not.
carries = ["issue", "authority"]

[[segment]]
id = "understand"
interior = "board"
board = "skills/interrogator/forms/UNDERSTAND.toml"
# Excursions dispatch under this tier.
model = "standard"
# The hat the conductor wears while working the board in place, and at this
# segment's own transition -- `hat`, engine/run.py. The spec-writer step
# below is a second, later round of the same segment, a distinct hand, not
# a second hat on this one: the spec states the problem standalone -- a
# reader with no tracker reach can say from it what is being solved and when
# it is done -- so drafting it is not interrogation. No dispatch: unlike the plan segment below, nothing here
# judges the spec apart from the cold panel on the transition, so ruling 6
# does not apply -- the spec-writer's own round and the panel that attacks
# it are already two hands.
board-worker = "interrogator"
step-form = "skills/spec-writer/forms/SPEC.toml"
worker = "spec-writer"
# This segment has no rework-form, so an `incorporate` (on CONSOLIDATE.toml
# below) refills the step-form: the spec-writer's own pass over the panel's
# findings, taken or rejected on its own judgement. A `rewrite` refills it
# too, as a fresh first cut holding the conductor's orders alone
# (`[one-look]`, engine/cli.py; ruling, 2026-09-25).
# One major rewrite, then the question goes up (ruling, 2026-09-25): a
# second `rewrite` before this seam releases mints an ask instead, counted
# since the seam last released or a pause's answer opened a round
# (`[rewrite-cap]`, engine/cli.py). Whether the conductor may answer that
# ask itself is the run's authority's to say (OPEN.toml).
rewrite-cap = 1

[segment.transition]
anchor = true
form = "forms/CONSOLIDATE.toml"
filler = "conductor"
validates = "board"   # refuses an open row or a self-answered decision on a release; an incorporate, a rewrite or an up does not have to close it first (`_releases`, engine/cli.py)
# The spec joins the run's prefill, so every later dispatch carries it -- on
# a release only, the same guard as `validates` above: an incorporate, a
# rewrite or an up leaves nothing intact to carry, and `_releases` is what keeps this fold
# from writing a blank spec over prefill's own.
# A list, not `true`, for the same reason `open` above carries one: `true`
# folds every field the step submitted, and this form's own `resolution`,
# `orders` and `calls` are this seam's bookkeeping, spent the moment it
# releases. Frozen into prefill they outlive the seam and read downstream as
# live orders -- exactly what engine/cli.py's fold warns of, "a frozen copy
# of it in every child's prefill reads as orders that it is not". Measured:
# issue112's plan seam ruled `rework` on gate 1, and the next planner read
# this seam's stale `resolution = "revise"` and `orders = "waived: this
# round releases"` as the ruling on that gate, quoted them as its evidence,
# and cut the wrong gate -- one whole round, and a workaround paragraph in
# the round after it naming three fields to disregard.
carries = ["spec", "key-terms", "settle", "obligations", "rungs"]
# Follow-up to ruling 3, 2026-09-03: mirrors run-a-gate's own review/ROUTE.toml
# and plan-to-execute's shape above. The critic panel's own two words are
# both inert (`release`, below), so the step stays open on either verdict --
# the conductor reads every finding and says where the round goes, the same
# as the other two route forms do.
# One look (`[one-look]`, engine/cli.py): the panel reads the opening spec
# and a rewrite's fresh one, never an incorporation's pass.
panel-rounds = "opening"
decides = "resolution"

  [[segment.transition.outcome]]
  value = "pass"
  does = "release"     # the panel's own word; the form's own submit is what releases now

  [[segment.transition.outcome]]
  value = "revise"
  does = "release"     # ditto -- the findings are the record, the form is the ruling on them

  [[segment.transition.outcome]]
  value = "incorporate"
  does = "incorporate"     # the spec-writer's one pass over the findings; no panel on what it returns

  [[segment.transition.outcome]]
  value = "rewrite"
  does = "rewrite"     # severe only: a fresh spec from the conductor's orders, and its own panel

  [[segment.transition.outcome]]
  value = "up"
  does = "pause"     # the round you cannot rule on from here; an ask standing at the parent until it answers

  [[segment.transition.panel]]
  form = "skills/critic/forms/CRITIC.toml"
  worker = "critic"
  model = "standard"
  criteria = "purpose: is this the right problem, and does solving it serve the root purpose the spec climbs to"

  [[segment.transition.panel]]
  form = "skills/critic/forms/CRITIC.toml"
  worker = "critic"
  model = "standard"
  criteria = "scope: is the boundary drawn, and is anything inside it meandering -- work the problem does not need"

  [[segment.transition.panel]]
  form = "skills/critic/forms/CRITIC.toml"
  worker = "critic"
  model = "standard"
  criteria = "done: could someone tell from the obligations alone when this problem is solved, and which of them says how rather than what"

# A board with no transition of its own: nothing here stands the run on a
# step, so `skeleton` mints none for it (no `form`, no `panel`) -- it exists
# only as a place consolidate's `obligations` field seeds, and execute's own
# `settle` verb reads. Positioned right after `understand`, the segment that
# seeds it, though nothing about its own reachability depends on where it
# sits: it is never `current`.
[[segment]]
id = "execution-state"
interior = "board"
board = "forms/EXECUTION_STATE.toml"

[[segment]]
id = "plan"
interior = "steps"
# The conductor that will judge the cut cannot also be the hand that drafted
# it (ruling 6) -- the round this seeds opens as a dispatch to a fresh
# planner's own child run, not a form on the issue-conductor's own worklist.
dispatches = "cut-a-gate"
step-form = "skills/planner/forms/PLAN.toml"
# An `incorporate` mints this in place of the step-form: the planner's one
# pass over the panel's findings, taken or rejected on its own judgement, and
# dispatched the same way the first cut is -- ruling 6 does not lapse on a
# second pass -- carried to the child as a form override so it fills
# REWORK.toml in place of cut-a-gate's own PLAN.toml. A `rewrite` mints the
# step-form instead: a fresh cut from the conductor's orders alone
# (`[one-look]`, engine/cli.py; ruling, 2026-09-25).
rework-form = "skills/planner/forms/REWORK.toml"
# See the same field on `understand` above: this seam is `plan-to-execute`.
# A release after every gate starts the count over, so each cut in a
# rolling horizon gets its own one rewrite.
rewrite-cap = 1
worker = "planner"
model = "standard"

[segment.transition]
anchor = true
form = "forms/PLAN_TO_EXECUTE.toml"
filler = "conductor"
# Ruling 3 (2026-09-02): mirrors run-a-gate's review/ROUTE.toml shape. The
# critic panel's own two words are both inert (`release`, below), so the
# step stays open on either verdict -- the conductor reads every finding and
# says where the round goes, the same as run-a-gate's route form does.
# `projects` still fires off this same submit, but conditionally now:
# `_mint_projected_gate` (engine/cli.py) mints only where the submit names a
# `plan`, since this form's own `incorporate`, `rewrite` and `up` also
# reach this step and none of them has passed critique intact.
projects = "run-a-gate"
# The panel below reads the run's opening cut, and a `rewrite`'s fresh one
# (`[one-look]`), and no other: a re-cut after a gate lands (`settle`,
# `replan`), an incorporation and a resumed round each stand this form
# alone, the conductor reading the planner's cut and the engine's one run
# of its `proof` (`_trial_proofs`, engine/cli.py) in the room. Read by
# `_mint_segment_round`; `skeleton()` mints the opening round's panel
# regardless. `every` is the other value and the default.
# Ruling, 2026-09-11: on the first outside run the first cut's panel found
# real defects (an import-boundary scan that would have failed on day one)
# and the re-cut panels after each gate found almost nothing a reading
# could find; a reviewer with a diff to run found what nine critic reports
# on one gate's three cuts missed.
panel-rounds = "opening"
# PLAN_TO_EXECUTE.toml's `resolution`, answered by both voices -- the
# panel's merged verdict first (always `release`, so it mints nothing), then
# the conductor's own typed word.
decides = "resolution"

  [[segment.transition.outcome]]
  value = "pass"
  does = "release"     # the panel's own word; the form's own submit is what releases now

  [[segment.transition.outcome]]
  value = "revise"
  does = "release"     # ditto -- the findings are the record, the form is the ruling on them

  [[segment.transition.outcome]]
  value = "incorporate"
  does = "incorporate"     # the planner's one pass over the findings, through the rework-form

  [[segment.transition.outcome]]
  value = "rewrite"
  does = "rewrite"     # severe only: a fresh cut from the conductor's orders, and its own panel

  [[segment.transition.outcome]]
  value = "up"
  does = "pause"     # the round you cannot rule on from here; an ask standing at the parent until it answers

  # One criterion per panelist. Three fresh-context readers disagreeing is a
  # panel; one reader holding three criteria is a reviewer with a checklist,
  # and it reads the plan once with divided attention instead of three times
  # with whole. Minted on the opening cut only -- `panel-rounds` above.

  [[segment.transition.panel]]
  form = "skills/critic/forms/CRITIC.toml"
  worker = "critic"
  model = "standard"
  criteria = "next step: is this gate the right next chunk toward the spec's done, and is it the smallest one that moves the run"

  [[segment.transition.panel]]
  form = "skills/critic/forms/CRITIC.toml"
  worker = "critic"
  model = "standard"
  criteria = "proof: would the gate's proof tell whether this chunk landed -- failing now, passing only once its purpose is true"

  [[segment.transition.panel]]
  form = "skills/critic/forms/CRITIC.toml"
  worker = "critic"
  model = "standard"
  criteria = "simplicity: argue for the smaller version and name what to delete -- anything added beside an existing thing rather than through it is the first suspect"

# The plan-to-execute transition's `projects` mints this interior: one
# dispatch step and one GATE_TRANSITION step, projected from the plan round
# that just passed critique -- never authored here. `adjudication-form` is
# this segment's own declaration of what a gate is adjudicated against --
# read by `_mint_gates` the way `step-form` and `rework-form` already are.
# A `remint` still authors a fresh gate directly at adjudication time, an
# unrelated case this segment's own outcome table still owns.
[[segment]]
id = "execute"
interior = "steps"
dispatches = "run-a-gate"
adjudication-form = "forms/GATE_TRANSITION.toml"
model = "standard"
decides = "plan-holds"

  [[segment.outcome]]
  value = "advance"
  does = "commit; settle"     # one commit for the gate that just proved out; then the
    # engine's own call -- an obligation still open on the execution-state
    # board refills plan for another round, every obligation disposed mints
    # nothing and the run walks to close

  [[segment.outcome]]
  value = "remint"
  does = "remint gate-spec"     # mints a fresh dispatch/adjudication pair from gate-spec

  # `settle` beside `close` because a drop is the other way this segment
  # empties. The execution-state board's one read hung on `advance`, a gate
  # committing -- so a run whose last pending gate was dropped rather than
  # advanced reached its terminal step with rows still open, reporting itself
  # done on obligations nothing had disposed (#95). `_settle_execution`
  # refuses nothing and mints nothing where every row is settled, so a drop
  # with a clean board walks on exactly as it did.
  [[segment.outcome]]
  value = "drop <gate-id>"
  does = "close; settle"     # closes the named not-done step and everything paired with it, then reads the board

  [[segment.outcome]]
  value = "replan"
  does = "skip execute; refill plan"     # every pending gate closed, the plan recut

[segment.transition]
anchor = true
terminal = true
form = "forms/CLOSE.toml"
filler = "conductor"
