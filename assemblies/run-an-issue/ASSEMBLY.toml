# Assembly: run one issue end to end. The skeleton is fixed; interiors are
# worked. Everything is a segment: an anchor step is a segment with no
# interior, only its transition. Default model tiers per segment; a gate spec
# may override its own.

assembly = "run-an-issue"
conductor = "issue-conductor"

[[segment]]
id = "open"

[segment.transition]
anchor = true
form = "forms/OPEN.toml"
filler = "conductor"

[[segment]]
id = "understand"
interior = "board"
board = "skills/interrogator/forms/UNDERSTAND.toml"
# Excursions dispatch under this tier.
model = "standard"
# The hat the conductor wears while working the board in place, and at this
# segment's own transition -- `hat`, engine/run.py. The spec-writer step
# below is a second, later round of the same segment, a distinct hand, not
# a second hat on this one: the spec is standalone -- a reader with no
# tracker reach can plan from it alone -- so drafting it is not
# interrogation. No dispatch: unlike the plan segment below, nothing here
# judges the spec apart from the cold panel on the transition, so ruling 6
# does not apply -- the spec-writer's own round and the panel that attacks
# it are already two hands.
board-worker = "interrogator"
step-form = "skills/spec-writer/forms/SPEC.toml"
worker = "spec-writer"
# This segment has no rework-form, so every revise is another pass at the
# same spec-writer round. After this many, a further revise mints the
# impasse form instead: the loop itself becomes the thing the conductor
# rules on. Counted since the last step-form mint, same as `plan` below --
# `forms/IMPASSE.toml` is shared with it, worded at the artifact each
# segment produces rather than at "plan" by name.
impasse-after = 3
impasse-form = "forms/IMPASSE.toml"
decides = "ruling"     # IMPASSE.toml's; UNDERSTAND.toml and SPEC.toml have no such field

  [[segment.outcome]]
  value = "advance"
  does = "transition"     # mints CONSOLIDATE alone, over the live revise

  [[segment.outcome]]
  value = "rework"
  does = "rework"     # another spec-writer round, findings as prefill

  [[segment.outcome]]
  value = "up"
  does = "release"     # mints nothing; the run walks to its terminal step

[segment.transition]
anchor = true
form = "forms/CONSOLIDATE.toml"
filler = "conductor"
validates = "board"   # engine refuses an open row or a self-answered decision
# The spec joins the run's prefill, so every later dispatch carries it.
# A panelist's prefill comes from prior steps in its own segment, so without
# this the critic -- the reader consolidate is written for -- never sees it.
carries = true
# Two voices, the same shape as plan-to-execute below: the critic panel
# reads the spec-writer's round and rules first: pass reaches this form (the
# interrogator's own record, key-terms and settle -- mechanical once the
# panel already cleared the spec), revise refills the segment with a fresh
# spec-writer round before this form is ever reached, three of those
# reaching the segment's own impasse form above. Named apart from `ruling`
# above so the two outcome tables stay disjoint: a word in one is never a
# legal answer read from the other.
decides = "resolution"

  [[segment.transition.outcome]]
  value = "pass"
  does = "release"     # the panel cleared the spec; this form's own submit is what releases

  [[segment.transition.outcome]]
  value = "revise"
  does = "rework"     # another spec-writer round, findings as prefill; no rework-form, so the same step-form again

  [[segment.transition.panel]]
  form = "skills/critic/forms/CRITIC.toml"
  worker = "critic"
  model = "standard"
  criteria = "standalone: could a fresh-context reader with no tracker reach plan from this spec alone"

  [[segment.transition.panel]]
  form = "skills/critic/forms/CRITIC.toml"
  worker = "critic"
  model = "standard"
  criteria = "commitments: is every obligation the spec makes stated as a numbered, checkable commitment"

  [[segment.transition.panel]]
  form = "skills/critic/forms/CRITIC.toml"
  worker = "critic"
  model = "standard"
  criteria = "simplicity: what can be deleted"

# A board with no transition of its own: nothing here stands the run on a
# step, so `skeleton` mints none for it (no `form`, no `panel`) -- it exists
# only as a place consolidate's `obligations` field seeds, and execute's own
# `settle` verb reads. Positioned right after `understand`, the segment that
# seeds it, though nothing about its own reachability depends on where it
# sits: it is never `current`.
[[segment]]
id = "execution-state"
interior = "board"
board = "forms/EXECUTION_STATE.toml"

[[segment]]
id = "plan"
interior = "steps"
# The conductor that will judge the cut cannot also be the hand that drafted
# it (ruling 6) -- the round this seeds opens as a dispatch to a fresh
# planner's own child run, not a form on the issue-conductor's own worklist.
dispatches = "cut-a-gate"
step-form = "skills/planner/forms/PLAN.toml"
# A revise mints this in place of the step-form: rework is its own move, not
# a second first draft. A replan still mints the step-form. A rework round
# dispatches the same way the first cut does -- ruling 6 does not lapse on
# round two -- carried to the child as a form override so it fills REWORK.toml
# in place of cut-a-gate's own PLAN.toml. The verdict that forces the round,
# and the loop it may become, stay the issue-conductor's to hold; only the
# drafting hand moves.
rework-form = "skills/planner/forms/REWORK.toml"
# After this many rework rounds on one artifact, a further revise mints the
# impasse form instead: the loop itself becomes the thing the conductor rules
# on. Counted since the last step-form mint, so a replan starts over.
impasse-after = 3
impasse-form = "forms/IMPASSE.toml"
worker = "planner"
# design-it-twice's three planner entries below name no model of their own,
# so without this the brief they render carries no tier and no resolved
# runner (`_panel_status`'s `panelist.get("model") or seg.get("model", "")`)
# -- same convention as `understand` and `execute` above, a segment-level
# default rather than a third, per-panelist one.
model = "standard"
decides = "ruling"     # IMPASSE.toml's; PLAN.toml and REWORK.toml have no such field

# design-it-twice (glossary): read only by `skeleton()`, so only round one.
  [[segment.panel]]
  worker = "planner"
  form = "skills/planner/forms/PLAN.toml"
  criteria = "unconstrained: the cut a single planner would draft"

  [[segment.panel]]
  worker = "planner"
  form = "skills/planner/forms/PLAN.toml"
  criteria = "constraint: fewest gates that still prove the spec"

  [[segment.panel]]
  worker = "planner"
  form = "skills/planner/forms/PLAN.toml"
  criteria = "constraint: smallest engine-code touch per gate"

  [[segment.outcome]]
  value = "advance"
  does = "transition"     # mints PLAN_TO_EXECUTE alone, over the live revise

  [[segment.outcome]]
  value = "rework"
  does = "rework"     # another pass, through the rework-form

  [[segment.outcome]]
  value = "up"
  does = "release"     # mints nothing; the run walks to its terminal step

[segment.transition]
anchor = true
form = "forms/PLAN_TO_EXECUTE.toml"
filler = "conductor"
# The round that just passed critique already cut the gate whole; submitting
# this form projects it into `execute` below rather than asking the
# conductor to retype what the panel already read (#27).
projects = "run-a-gate"
# The panel's own decides field, distinct from `ruling` above: that one is
# IMPASSE.toml's, filled by the conductor; this one is PLAN_TO_EXECUTE.toml's
# `resolution`, and its value is never typed -- it is the merged verdict,
# resolved through the outcome rows below the same way a submitted decision
# field would be. Named apart from `ruling` so the two outcome tables stay
# disjoint: a word in one is never a legal answer read from the other.
decides = "resolution"

  [[segment.transition.outcome]]
  value = "pass"
  does = "release"     # the panel cleared the plan; the projection above already mints

  [[segment.transition.outcome]]
  value = "revise"
  does = "rework"     # another pass, through the rework-form, findings as prefill

  # One criterion per panelist. Three fresh-context readers disagreeing is a
  # panel; one reader holding three criteria is a reviewer with a checklist,
  # and it reads the plan once with divided attention instead of three times
  # with whole.

  [[segment.transition.panel]]
  form = "skills/critic/forms/CRITIC.toml"
  worker = "critic"
  model = "standard"
  criteria = "intent-fit: does the plan serve the spec it was built on"

  [[segment.transition.panel]]
  form = "skills/critic/forms/CRITIC.toml"
  worker = "critic"
  model = "standard"
  criteria = "testability: can each gate's proof be exercised, and does it cover what that gate's scope commits to"

  [[segment.transition.panel]]
  form = "skills/critic/forms/CRITIC.toml"
  worker = "critic"
  model = "standard"
  criteria = "simplicity: what can be deleted"

# The plan-to-execute transition's `projects` mints this interior: one
# dispatch step and one GATE_TRANSITION step, projected from the plan round
# that just passed critique -- never authored here. `adjudication-form` is
# this segment's own declaration of what a gate is adjudicated against --
# read by `_mint_gates` the way `step-form` and `rework-form` already are.
# A `remint` still authors a fresh gate directly at adjudication time, an
# unrelated case this segment's own outcome table still owns.
[[segment]]
id = "execute"
interior = "steps"
dispatches = "run-a-gate"
adjudication-form = "forms/GATE_TRANSITION.toml"
model = "standard"
decides = "plan-holds"

  [[segment.outcome]]
  value = "advance"
  does = "commit; settle"     # one commit for the gate that just proved out; then the
    # engine's own call -- an obligation still open on the execution-state
    # board refills plan for another round, every obligation disposed mints
    # nothing and the run walks to close

  [[segment.outcome]]
  value = "remint"
  does = "remint gate-spec"     # mints a fresh dispatch/adjudication pair from gate-spec

  [[segment.outcome]]
  value = "drop <gate-id>"
  does = "close"     # closes the named not-done step and everything paired with it

  [[segment.outcome]]
  value = "replan"
  does = "skip execute; refill plan"     # every pending gate closed, the plan recut

[segment.transition]
anchor = true
terminal = true
form = "forms/CLOSE.toml"
filler = "conductor"
