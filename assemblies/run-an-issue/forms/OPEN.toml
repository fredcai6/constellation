# Anchor: open. Owned by run-an-issue; filled by the conductor.
# When this run was dispatched by an epic, issue and authority arrive as
# prefill and only questions is filled here.

imperative = """
Confirm what this run is solving and under what authority, then seed the
understanding worklist. Seed questions are a starting cut, not a script — the
worklist grows and shrinks as answers land."""

[[field]]
id = "issue"
kind = "artifact"
note = "The issue this run solves, per standards/issue.md — a file in the work location; the conductor writes prefill to it."

[[field]]
id = "authority"
kind = "decision"
note = """
Who your principal is, what you own, your latitude, where gaps go — the
principal's recorded answer. Say too whether you may answer a rewrite-cap
ask yourself: a spec or a cut gets one rewrite, and a second becomes an ask
at the principal, yours to answer only where this latitude grants it. Derived automatically when this run has a parent;
recorded from the human when it does not."""

[[field]]
id = "questions"
kind = "plan"
mints = "board rows"
board = "understand"
note = """
One block per seed question, minted as rows on the understand board
(UNDERSTAND.toml). A seed may carry any board column (move, cluster, after);
only question and type carry an answer here. `board` names which of this
assembly's two board segments these rows seed -- the moment a second one
(execution-state) exists, the engine can no longer pick by being the only
one there."""

  [[field.item]]
  id = "question"
  note = "The question, concrete enough that its answer is checkable."

  [[field.item]]
  id = "excursion"
  note = """
Leave blank unless the seed already knows the excursion. It is here so every
seeded row carries the column, which the interrogator then fills with the
child run that would settle the row or the reason it declines one."""

  [[field.item]]
  id = "type"
  note = """
fact | decision. A fact is answerable from the code or an understanding move —
resolve it yourself with evidence. A decision is a choice the principal owns —
never self-answer it."""
