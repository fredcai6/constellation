# Anchor: understand → plan. Owned by run-an-issue; filled by the conductor,
# under the interrogator's own hat -- the spec itself is the spec-writer's
# round, judged cold by the panel above, not summarized again here.
# Ruling 3's follow-up (2026-09-03), and one look (2026-09-25): the
# critic panel reads the opening spec, and a rewrite's fresh one, and rules
# first -- both of its words release, so nothing advances on the panel's say
# alone -- and this form is where its round is disposed of. An
# incorporation's round stands this form alone, with no panel, since the
# spec-writer has already ruled on every finding it carried. On a release
# the engine also validates the understand board: an open row refuses, a
# decision answered without the principal's words refuses; the escape is
# deferred: <reason>, journaled -- an incorporate, a rewrite or an up does
# not reach that check, since the board is not done until the spec passes.

imperative = """
Read the round above and say where it goes. A spec gets one look: where the
panel found nothing severe, the spec-writer's own judgement finishes it --
`incorporate` hands it every finding to take or reject, and what comes back
is released here, not read by another panel. Where you are standing on that
returned spec, release it. A finding is severe when it changes which
problem this run is solving, or the fundamental thing its next step would
code; for that, `rewrite`, and write in `orders` what the spec must say,
forward, with nothing about what the last one got wrong -- the rewrite
starts from your orders alone, and gets its own look. Call every finding
the panel returned. On a release (a `pass`, or a `revise` you are not
sending back) this step will not complete while a row is open on the board
above, or while a decision is recorded with no words from the principal --
close what is left there, every row answered, mooted, or deferred with a
reason -- and record this segment's own bookkeeping below: the glossary and
what the board's excursions produced, neither of them the spec, both
staying behind in this run's own record."""

[[field]]
id = "resolution"
kind = "decision"
note = """
pass | revise | incorporate | rewrite | up. The first two are the panel's
own words, resolved onto this same table when its verdict returned -- both
release the round exactly as leaving the fields below filled and submitting
does. `incorporate` is the spec-writer's one pass over the findings you
called `writer`, taken or rejected on its own judgement; the spec it
returns stands here with no panel, and your next word on it is a release,
or a `rewrite` if the pass itself went severely wrong -- a second
incorporate refuses. `rewrite` is a fresh spec, written from your `orders`
alone, with its own panel: the call for a finding you called `severe`. A
spec gets one rewrite; a second, before this seam releases, becomes an ask
at the run's principal instead.
`up` is the round you cannot rule on from here, the issue itself being
wrong the usual reason: it pauses this segment rather than releasing it,
your reason standing as an ask one tier up, with whatever it answers
carried back as the next round's orders."""

[[field]]
id = "orders"
kind = "evidence"
optional = true
note = """
Your own words for the next round. On a `rewrite` they are the whole of
what the fresh spec-writer holds: the problem, the boundary, and what done
looks like, stated forward -- never the findings or the draft they were
about. On an `incorporate` they ride ahead of the findings, as yours.
`waived: none` where the findings say it all. Never write an order into
`calls` as if the panel had returned it."""

[[field]]
id = "spec"
kind = "artifact"
optional = true
note = """
The specification that just passed critique, in this run's work location --
filled when this round releases (a `pass`, or a `revise` you are not
sending back) and left blank on an `incorporate`, a `rewrite` or an `up`, since none has
anything intact to carry. Point at it — never retype it: `carries` puts this
field in the run's own prefill, which is the only way the plan segment's
planner and its critics, a different segment entirely, ever see it. The
name is standards/glossary.md's `spec` — the same one explore-an-idea's own
SPEC.toml artifact answers to."""

[[field]]
id = "key-terms"
kind = "evidence"
optional = true
note = """
This work's load-bearing terms; each cites its glossary entry or proposes a
new one. Coining a synonym is a defect. Filled on a release, the same as
`spec`; left blank on any other word."""

[[field]]
id = "settle"
kind = "evidence"
optional = true
note = """
What the board's excursion column produced: every excursion dispatched, the
one question it answered and what its returns said. `waived: none` where none
was dispatched -- the one word, not a paragraph saying so; the declines are
on the board already. The row asks; this reports. It is the only path by which a
per-row brief reaches the planner, the fresh-context panel, and the next
reader of the journal — the board stays behind in the work location, and
these fields are what join the run's prefill. Filled on a release, the same
as `spec`; left blank on any other word."""

# [plan-fields-last]
# Rationale: `forms.materialize` writes a `kind = "plan"` field as a bare
#   `[[id]]` array-of-tables header; any scalar field's `key = ""` written
#   after that header lands inside the array-of-tables' last block under
#   TOML's own rule for what a headerless key belongs to, not beside it as a
#   sibling. `resolution`, `spec`, `key-terms` and `settle` -- every scalar
#   this form declares -- all stand above every one of the form's own plan
#   fields, `obligations`, `rungs` and `calls`, for the same reason.
# See: tests/test_reachable_briefs.py
[[field]]
id = "obligations"
kind = "plan"
mints = "board rows"
board = "execution-state"
optional = true
note = """
One block per obligation the spec makes, verbatim from its own list, cited
by key. Minted as rows on the execution-state board (EXECUTION_STATE.toml) the
moment this releases -- every gate's advance reads their dispositions
afterward to decide whether the run is done, never the spec's prose again.
Leave blank on a run whose gates already close it out some other way, or on
any word but a release, where there is no spec settled yet to seed rows from;
a run that fills nothing here settles trivially, exactly as before this
board existed."""

  [[field.item]]
  id = "obligation"
  note = "One spec obligation, verbatim."

[[field]]
id = "rungs"
kind = "plan"
optional = true
note = """
One block per anchor the spec reserved, verbatim from its own `rungs`
field: the anchor id this run's work will land, and the anchor id(s) it
sits under. `carries` puts this field in the run's own prefill, which is
the only way a gate's own commit ever sees it -- the engine writes
`map/parents.jsonl`'s row itself once that gate actually lands the
anchor; nothing here writes the line by hand. Filled on a release, the
same as `spec`; left blank on any word but a release, where there
is nothing intact to carry. Leave blank where the spec reserved none."""

  [[field.item]]
  id = "anchor"
  note = "The anchor id, verbatim from the spec's own `rungs` field."

  [[field.item]]
  id = "parents"
  note = "The anchor id(s) it sits under, verbatim from the spec's own `rungs` field."

# `calls` is written last, after every scalar and after `obligations`,
# because a plan field renders as a bare `[[calls]]` header and every scalar
# declared after it would nest inside that array's last block instead of
# standing as its own field (tests/test_reachable_briefs.py holds the whole
# tree to this). The reading order is the other one: rule the findings,
# then say where the round goes.
[[field]]
id = "calls"
kind = "plan"
optional = true
note = """
One block per finding the panel returned -- every one of them gets a
call, and the call is where the finding goes.

`writer` -- the spec-writer's to take or reject on an `incorporate`. The
call most findings take, true or not: the writer judges its own spec.
`severe` -- the finding changes which problem this run is solving, or the
fundamental thing its next step would code. A round with one is a
`rewrite`, and your `orders` say what the fresh spec must hold instead.
`beyond` -- real, and outside what this spec set out to do. It is
journaled as a triage note when you submit and reaches the close form
from there, and never becomes work here.

An `up` carries the whole table, every call beside its finding, to the
tier the ask stands at. Quote each finding as it was written rather than
numbering it: on an `incorporate` the `writer` blocks are literally what
the spec-writer arrives holding. Leave the field out only where no panel
returned findings -- an incorporation's round has none."""

  [[field.item]]
  id = "finding"
  note = "The panel's finding as it was written -- quoted, never summarised."

  [[field.item]]
  id = "call"
  kind = "decision"
  note = "writer | severe | beyond"
