# Anchor: understand → plan. Owned by run-an-issue; filled by the conductor.
# On submit the engine validates the understand board: an open row refuses, a
# decision answered without the principal's words refuses; the escape is
# deferred: <reason>, journaled.

imperative = """
Work the board named above until every row is answered, mooted, or
deferred with a reason — this step will not pass while a row is open, or
while a decision is recorded with no words from the principal. Then
consolidate what a fresh-context planner needs: the understanding, not the
journey."""

[[field]]
id = "learnings"
kind = "evidence"
note = """
What is now known that the issue did not state: the shape of the problem, the
constraints that bind, where the danger is. Necessary context only."""

[[field]]
id = "key-terms"
kind = "evidence"
note = "This work's load-bearing terms; each cites its glossary entry or proposes a new one. Coining a synonym is a defect."

[[field]]
id = "settle"
kind = "evidence"
note = """
What the board's excursion column produced: every excursion dispatched, the
one question it answered and what its returns said; every decline, and the
reason given. The row asks; this reports. It is the only path by which a
per-row brief reaches the planner, the cold panel, and the next reader of the
journal — the board stays behind in the work location, and these fields are
what join the run's prefill."""
