# Anchor: understand -> plan. Owned by run-an-issue; filled by the conductor.
# The critic panel reads the opening spec, and a rewrite's fresh one; this
# form is where the conductor rules on what the panel found. An
# incorporation's round stands here with no panel. On a release the engine
# also validates the understand board: an open row refuses, and so does a
# decision answered without the principal's words.
# PLAN_TO_EXECUTE.toml takes `resolution`, `orders` and `calls` from this
# file (`same-as`): the two seams rule a panel's round the same way.

imperative = """
The panel has read the spec. Rule on its round.

1. Call every finding, in `calls`. You stand between the panel and the
   spec-writer, and you judge each finding against the spec as a whole:
   `writer` where it holds at the spec's grain, `rejected: <reason>` where
   it does not hold, is not this spec's to answer, or is about how the
   work gets built. The panel's `revise` is its word on its own findings.
   It is not a ruling on the spec.

2. Rule the round, in `resolution`:
   - `incorporate` (the default when you kept any finding): the
     spec-writer takes or rejects the findings you called `writer`. What
     comes back is released here with no second panel.
   - `rewrite`: the findings you kept, one or several together, change
     which problem this run is solving. Write in `orders` what the spec
     must say. The fresh spec starts from your orders alone and gets its
     own panel.
   - release: you kept no finding, or you are standing on a spec that came
     back from an incorporation. Fill `spec` and the fields after it.
   - `up`: you cannot rule from here. The run pauses and asks one tier up.

3. On a release, close the board first. This step will not complete while
   a row is open on the board, or while a decision has no words from the
   principal: every row is answered, mooted, or deferred with a reason."""

[[field]]
id = "resolution"
kind = "decision"
note = """
pass | revise | incorporate | rewrite | up.

`pass` and `revise` are the panel's words. Typed here, both release the
round; `revise` sends nothing back. Use `pass` to release.
`incorporate`: the writer makes one pass over the findings you called
`writer`, taking or rejecting each. What it returns comes back to this
form with no panel. Your next word is then a release, or `rewrite` if the
pass broke the artifact. A second `incorporate` is refused.
`rewrite`: a fresh artifact from your `orders` alone, with its own panel.
An artifact gets one rewrite; a second becomes an ask at the run's
principal.
`up`: the round you cannot rule on from here, usually because what the
artifact answers to is itself wrong. The run pauses; the answer comes
back as the next round's orders."""

[[field]]
id = "orders"
kind = "evidence"
optional = true
note = """
Your own words for the next round.

On a `rewrite` they are all the writer gets. State what the artifact must
say, forward. Use what the findings established as ground to build on; do
not describe what the last draft got wrong.
On an `incorporate` they go to the writer ahead of the findings.

`waived: none` where the findings say it all. Never put an order in
`calls` as if the panel had written it."""

[[field]]
id = "spec"
kind = "artifact"
optional = true
note = """
The path of the specification, in this run's work location. Fill it only
on a release; leave it blank on `incorporate`, `rewrite` or `up`. Give the
path; do not paste the document. Every later step reads the spec through
this field."""

[[field]]
id = "key-terms"
kind = "evidence"
optional = true
note = """
The terms this work depends on. Each one cites its glossary entry or
proposes a new entry. Do not coin a synonym for a term that has one. Fill
it only on a release."""

[[field]]
id = "settle"
kind = "evidence"
optional = true
note = """
What the board's excursions produced: each excursion dispatched, the one
question it answered, and what its returns said. A row that declined an
excursion is on the board already; do not repeat it here. `waived: none`
where none was dispatched. This field is how an excursion's result reaches
the planner and the panel; the board itself stays behind. Fill it only on
a release."""

# Block lists come last: a `kind = "plan"` field renders as a bare `[[id]]`
# header, and TOML nests every scalar written after it into that array's
# last block. tests/test_reachable_briefs.py holds every form to this.
[[field]]
id = "obligations"
kind = "plan"
mints = "board rows"
board = "execution-state"
optional = true
note = """
One block per obligation the spec makes, word for word from its own list.
Each becomes a row on the execution-state board when this round releases,
and the run is done when every row is disposed. Fill it only on a
release."""

  [[field.item]]
  id = "obligation"
  note = "One spec obligation, word for word."

[[field]]
id = "rungs"
kind = "plan"
optional = true
note = """
One block per anchor the spec reserved in its own `rungs` field: the anchor
id this run's work will land, and the anchor ids it sits under. The engine
writes the `map/parents.jsonl` row itself once a gate lands the anchor.
Fill it only on a release. Leave it out where the spec reserved none."""

  [[field.item]]
  id = "anchor"
  note = "The anchor id, word for word from the spec's `rungs` field."

  [[field.item]]
  id = "parents"
  note = "The anchor id or ids it sits under, word for word from the spec's `rungs` field."

# `calls` is written last of all, for the reason given above. The reading
# order is the other one: call the findings, then rule the round.
[[field]]
id = "calls"
kind = "plan"
optional = true
note = """
One block per finding the panel returned. Every finding gets a call.

`writer`: the finding holds at the artifact's own grain. For a spec that
is the problem, its boundary, or how anyone tells it is done. For a plan
it is the next chunk, its purpose, its scope, or whether its proof could
tell it landed. On an `incorporate` the writer takes or rejects it; on a
`rewrite` your `orders` build on it. A finding that the artifact carries
detail below its grain is a `writer` finding, and the fix is to delete
the detail.

`rejected: <reason>`: the finding does not hold against the artifact as a
whole, or it is real but not this artifact's to answer, or it is about how
the work gets built, which the implementer chooses. The reason is
required. A rejected finding becomes no work here.

Quote each finding as it was written; do not number or summarise it. On an
`incorporate` the `writer` blocks are exactly what the writer receives. An
`up` carries the whole table to the tier above. Leave the field out only
where no panel returned findings."""

  [[field.item]]
  id = "finding"
  note = "The panel's finding as it was written. Quote it; do not summarise."

  [[field.item]]
  id = "call"
  kind = "decision"
  note = "writer | rejected: <reason>"
