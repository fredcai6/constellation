# Board: execution state. Owned by run-an-issue; seeded once, from the
# spec's own numbered commitments, when consolidate releases
# (CONSOLIDATE.toml's `obligations` field). Worked in place afterward: the
# gate that settles a row claims its disposition at close (GATE_CLOSE.toml's
# `claims`), the issue-conductor accepts or contests the claim in
# GATE_TRANSITION.toml, and the engine writes the word they settle on here
# -- nothing else writes to this file.
#
# The engine's own read is at execute's `advance`, every gate's commit: a
# row still `open` refills the plan segment for another round; every row
# disposed mints nothing, and the run walks on to its terminal step. The
# engine reads dispositions and refuses nothing -- deferred, invalidated,
# handed-off and rejected all count as settled, exactly like satisfied, and
# no word here is checked against anything.

[[obligation]]
id = "o1"
obligation = ""  # the spec's own numbered commitment, verbatim.
status = "open"  # open | satisfied | deferred: <reason> | invalidated: <reason>
                 # | handed-off: <reason> | rejected: <reason>
gate = ""        # the gate that disposed this row -- filled beside status,
                 # blank while open.
