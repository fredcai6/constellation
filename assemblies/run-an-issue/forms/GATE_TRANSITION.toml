# Step: gate adjudication. Owned by run-an-issue; filled by the conductor.
# Minted per gate by the plan-to-execute transition; the gate's returns stamp
# here when the child closes. Not a re-review: the panel already judged
# whether the work fills the spec, and the gate-conductor has already
# claimed the obligations the gate was cut against. You judge the gate's
# purpose -- what the rest of the run takes as true now that this gate has
# landed -- and whether the plan still holds. Act on the plan, never on
# the diff.

imperative = """
The gate has returned. It judged its obligations; you judge its purpose.
Open the root that shows what this gate makes true -- the artifact, a check
you re-run -- then decide whether the plan still holds, and accept or
contest each obligation the gate claims."""

[[field]]
id = "purpose-holds"
kind = "evidence"
note = """
The claim the rest of the run now takes as true from this gate -- its
`purpose`, in your orders -- and what showed it: the root you opened or
the check you ran that exercised that claim itself, not the obligations
under it. A gate can satisfy every obligation it was cut against and
still leave its purpose false, and every later gate then measures against
a claim nobody checked. Where nothing you can open shows the claim, say so
here; `plan-holds` is where that becomes a ruling."""

[[field]]
id = "findings"
kind = "evidence"
optional = true
note = """
What this gate taught the plan, and only where a `replan` or the next gate
needs it: a `replan` carries this straight into the fresh plan round as its
own `findings`, the same word PLAN.toml's header uses for a rework round's.
`waived: none` otherwise -- nineteen fills of about six hundred words each
crossed into nothing, since no run ever replanned. Your verification of the
return belongs in the journal as a note, not here."""

[[field]]
id = "plan-holds"
kind = "decision"
note = """
advance | remint | drop <gate-id> | replan — on anything but advance, the
amend is the evidence. Adjudicate the child's amend summary: accept or
contest each entry. remint fills gate-spec below with the fresh gate; it
closes nothing, since this gate has already run and history is not
amendable. drop closes the named gate's dispatch and adjudication steps —
it must be pending, and never this one."""

[[field]]
id = "dispositions"
kind = "plan"
mints = "dispositions"
board = "execution-state"
drafted-by = "claims"
optional = true
note = """
The gate's own claims, one block per obligation, written into this form
from its close (GATE_CLOSE.toml's `claims`) before you open it. Accept a
claim by leaving its block as it stands; contest one by changing its word,
the reason after the colon. The gate named each root so that you can open
it. What you do not do is re-derive the claim from the diff: that is the
gate's work done twice, and it is what crowded out the question
`purpose-holds` asks. The engine writes each block's word onto the
matching row of the execution-state board, this gate's own id stamped
alongside it. Delete a block and its obligation stays open, and the run
plans another gate for it; a gate that claimed nothing leaves this
blank."""

  [[field.item]]
  id = "obligation"
  note = "The obligation's row id on the execution-state board, e.g. o1."

  [[field.item]]
  id = "disposition"
  note = """
satisfied | deferred: <reason> | invalidated: <reason> | handed-off:
<reason> | rejected: <reason>"""

  [[field.item]]
  id = "root"
  optional = true
  note = """
What shows the word: the gate's own root as it returned it, or the one you
opened instead where you contest."""

[[field]]
id = "gate-spec"
kind = "plan"
optional = true
note = """
Only for remint: the fresh gate replacing the one that just ran, same shape
as a plan-to-execute gate block. Leave empty for advance, drop, or replan —
an empty spec on a remint is refused."""

  [[field.item]]
  id = "purpose"
  note = """
What later gates and the run's conclusion will take as true once this gate
lands -- a claim someone could test, not a summary of what changed. Second,
which of the five in `standards/approach.md` it serves."""

  [[field.item]]
  id = "scope"
  note = "Where the change lives, and what is out of bounds."

  [[field.item]]
  id = "proof"
  kind = "check"
  note = """
A command that passes on an empty diff proves nothing, and so does one that
covers less than `scope` promised -- one check per obligation. It exercises
purpose's claim too: a proof that passes while purpose is false has proved
the wrong thing. Write the exact string you ran, never a description of it:
this field is shell-executed in the dispatched child, so prose becomes a
command and fails there, after the work is done. Reference the command
palette (constellation.toml) rather than hardcoding where it applies."""

  [[field.item]]
  id = "budget"
  optional = true
  note = "Same as PLAN.toml's `budget`: declare one only when the proof is long because it is right. Whole seconds, a bare integer -- not a paragraph of rationale."

  [[field.item]]
  id = "model"
  optional = true
  note = "Tier override for this gate: light | standard | heavy. Omit for the assembly default."
