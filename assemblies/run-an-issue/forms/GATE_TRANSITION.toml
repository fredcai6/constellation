# Step: gate adjudication. Owned by run-an-issue; filled by the conductor.
# Minted per gate; the gate's returns arrive here when the child closes. Not
# a re-review: the panel judged the diff, and the gate-conductor claimed the
# obligations the gate was cut against. The conductor judges the gate's
# purpose and whether the plan still holds.

imperative = """
The gate has returned. It judged its obligations; you judge its purpose.

1. Check the purpose yourself. Open what this gate produces (the artifact,
   the output a person would read) or re-run a check that exercises the
   claim in its `purpose`. Read it against the spec's own words. The gate's
   tests passing is not this check.

2. Rule whether the plan still holds, in `plan-holds`.

3. Accept or contest each obligation the gate claims, in `dispositions`."""

[[field]]
id = "purpose-holds"
kind = "evidence"
note = """
The claim the rest of the run now relies on from this gate (its `purpose`,
in your orders), and what showed it: the artifact you opened or the check
you ran that exercised that claim itself. A gate can satisfy every
obligation it was cut against and still leave its purpose false. If
nothing you can open shows the claim, say so here and rule on it in
`plan-holds`."""

[[field]]
id = "findings"
kind = "evidence"
optional = true
note = """
What this gate taught the plan. Fill it only where a `replan`, a `remint`
or the next cut needs it: it goes to the planner as `findings`.
`waived: none` otherwise. A record of how you verified the return belongs
in a journal note, not here."""

[[field]]
id = "critical-question"
kind = "decision"
optional = true
note = """
matches | differs: <reason>. Fill it only where the cut's
`critical-questions` named this gate to answer a question. Rule whether
the gate's actual answer, from its residue, matches the answer the plan
expected. `differs` sends the open plan back to the planner for one
review. Leave it blank where this gate answers no question."""

[[field]]
id = "plan-holds"
kind = "decision"
note = """
advance | remint | drop <gate-id> | replan.

`advance`: the purpose holds. The engine commits the gate and starts the
next one.
`remint`: the purpose does not hold and a replacement gate will fix it.
Fill `gate-spec` below. The gate's work is still committed, because it
already ran.
`drop <gate-id>`: close a different, still-pending gate that is no longer
needed. Never this gate.
`replan`: the plan itself no longer holds. Every pending gate closes and
the planner cuts again.

On anything but `advance`, also read the child's amend summary in your
orders and say which entries you accept or contest."""

[[field]]
id = "dispositions"
kind = "plan"
mints = "dispositions"
board = "execution-state"
drafted-by = "claims"
optional = true
note = """
The gate's claims, one block per obligation, already written here from its
close form. Accept a claim by leaving its block as it stands. Contest one
by changing its word, with the reason after the colon. The gate named a
root for each claim so that you can open it; do not re-derive the claim
from the diff.

The engine writes each block's word onto the execution-state board. A
block you delete, and a block left as `open:`, both leave the obligation
open, and the run plans another gate for it. A gate that claimed nothing
leaves this field blank."""

  [[field.item]]
  id = "obligation"
  note = "The obligation's row id on the execution-state board, e.g. o1."

  [[field.item]]
  id = "disposition"
  note = """
satisfied | open: <reason> | deferred: <reason>

`open` keeps the obligation in this run: the plan cuts again, and the run
cannot close while one stands. `deferred` says this run is not doing it:
another issue has it, or it stopped being true. The reason says which, and
names whoever has it."""

  [[field.item]]
  id = "root"
  optional = true
  note = """
What shows the word: the gate's own root as it returned it, or the one you
opened instead where you contest."""

[[field]]
id = "gate-spec"
same-as = "skills/planner/forms/PLAN.toml#gates"
optional = true
note = """
Only for `remint`: the gate that replaces the one that just ran, one block.
Leave it out for advance, drop or replan. A remint with no block is
refused."""
