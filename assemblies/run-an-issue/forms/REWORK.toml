# Step: rework round of plan. Owned by run-an-issue; filled by the conductor.
# A revise verdict mints this form in place of PLAN.toml; the panel's merged
# findings arrive as prefill. No design-it-twice field: round one weighed the
# alternatives, and re-arguing them is accretion.

imperative = """
Work the findings into the plan. Delete the restated. Move accepted detail into
the gate's latitude. Replace a twice-patched proof in kind. Growing is allowed
and scope does widen -- but past about 5% over round one you are more likely
losing a scope argument than winning a rigour one. Say which, in `deleted`."""

[[field]]
id = "plan"
kind = "artifact"
note = """
The plan document, in the work location: the approach, the gates it cuts into
(purpose, scope, proof — the plan-to-execute transition copies these), and the
risks that would change it. Implementation detail below gate grain is a
defect — that is the gate's latitude."""

[[field]]
id = "findings-addressed"
kind = "evidence"
record-only = true
note = """
Rework only, and only the round just past: each finding accepted, naming the
edit, or contested, with the reason. A ledger, not a narrative.

This is for the record and the conductor, never for the next critic — it
stays out of a panelist's prefill, because a reviewer told what was wrong
last time is aimed at those spots and steered off everything else. First
pass: waived: first pass."""

[[field]]
id = "deleted"
kind = "evidence"
record-only = true
note = """
What came out of the plan this round, and why each cut was safe. Open with this
round's word count against round one's: the plan artifact is overwritten in
place and the journal keeps only its path, so that number survives nowhere else.
For the record and the conductor, never the next critic — it stays out of a
panelist's prefill."""

[[field]]
id = "key-terms"
kind = "evidence"
note = "New terms this plan introduces; each cites its glossary entry or proposes one. Coining a synonym is a defect."
