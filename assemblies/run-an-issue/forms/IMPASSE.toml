# Step: impasse. Owned by run-an-issue; filled by the conductor. Minted once
# a segment has been sent back `impasse-after` times -- `sent-back` in the
# orders says how many, since the two segments sharing this form need not
# allow the same number. Both declare zero now (ruling, 2026-09-11: once a
# spec or a cut has had its look over, the proof is in execution), so the
# first send-back of an artifact lands here: another round is a ruling, made
# by naming what it changes, never a default. Shared by `understand` (the
# spec-writer's spec) and `plan` (the planner's plan) rather than forked into
# two near-duplicates named after each artifact -- both segments read it
# worded at "the artifact" instead. `arrival` in the orders reads
# `rework-rounds` here always -- the panel's verdict is `pass | revise`, so a
# root objection arrives as a revise finding like any other. It carries no
# panel: one more fresh-context reader is the loop, not the way out.

imperative = """
You are sending this artifact back, and this segment allows no free round --
`sent-back` in your orders is how many times it was sent back before this.
Rule on the artifact, not on the findings: another round is the answer only where
you can name what it changes that a reading alone did not, and the gate
that builds from this artifact is where the rest is found. Say which way
this run goes, and why."""

[[field]]
id = "ruling"
kind = "decision"
note = """
advance | rework | up. `advance` takes the artifact to its transition as it
stands, over a live objection — the findings remain the record that says you
did. `rework` runs another round, and is the answer only when you can name
what that round changes that the sent-back rounds did not. `up` pauses this
segment rather than closing the run: your ruling and its reason stand as an
ask one tier up, and this segment resumes -- with whatever the ask answers,
as this round's own next orders -- once it does. The right move when the
artifact itself is what is wrong, not merely short of a fix."""

[[field]]
id = "why"
kind = "evidence"
note = """
What the panel landed on, and what that says about the artifact. The run's own
record is the evidence: name the field or the claim the findings kept landing
on across the sent-back rounds."""
