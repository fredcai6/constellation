# Transition: plan → execute. Owned by run-an-issue; filled by whoever
# conducts the issue. Ruling 3 (2026-09-02): mirrors run-a-gate's own
# review/ROUTE.toml shape. Two voices on the run's opening cut, and on a
# rewrite's fresh one (one look, 2026-09-25): the critic panel reads the
# plan and rules first -- both of its words release, so nothing mints on the
# panel's say alone -- and this form is where its round is disposed of.
# Every other cut (an incorporation, a re-cut after a gate lands, a resumed
# round) stands this form alone: the conductor reads the planner's cut, and
# the engine's one run of its `proof`, in the room above.

imperative = """
The cut is in the room above, with what its `proof` did when the engine ran
it once against the tree as it stands: a real check fails there, before the
work; one that passes on an empty diff proves nothing; a string the shell
could not run will fail the gate after the work is done. A plan gets one
look: where the panel found nothing severe, the planner's own judgement
finishes it -- `incorporate` hands it every finding to take or reject, and
what comes back is released here, not read by another panel. Where you are
standing on that returned cut, or on a re-cut after a gate landed, release
it. A finding is severe when it changes which problem the run is solving,
or the fundamental thing this gate would code; for that, `rewrite`, and
write in `orders` what the next gate must do, forward, with nothing about
what the last cut got wrong -- the rewrite starts from your orders alone,
and gets its own look. Call every finding the panel returned. The round
that just landed already cut the gate whole -- purpose, scope, proof, and
any model or direction override -- so a release needs nothing retyped,
only the plan artifact pointed at."""

[[field]]
id = "resolution"
kind = "decision"
note = """
pass | revise | incorporate | rewrite | up. The first two are the panel's
own words, resolved onto this same table when its verdict returned -- both
release the round exactly as leaving the plan field filled and submitting
does. `incorporate` is the planner's one pass over the findings you called
`writer`, taken or rejected on its own judgement; the cut it returns stands
here with no panel, and your next word on it is a release, or a `rewrite`
if the pass itself went severely wrong -- a second incorporate refuses.
`rewrite` is a fresh cut, written from your `orders` alone, with its own
panel: the call for a finding you called `severe`. A cut gets one rewrite;
a second, before this seam releases, becomes an ask at the run's principal
instead. `up` is the round you
cannot rule on from here, the spec being wrong the usual reason: it pauses
this segment rather than releasing it, your reason standing as an ask one
tier up, with whatever it answers carried back as the next round's
orders."""

[[field]]
id = "orders"
kind = "evidence"
optional = true
note = """
Your own words for the next round. On a `rewrite` they are the whole of
what the fresh planner holds: the next chunk the run needs and why, stated
forward -- never the findings or the cut they were about. On an
`incorporate` they ride ahead of the findings, as yours. `waived: none`
where the findings say it all. Never write an order into `calls` as if the
panel had returned it."""

[[field]]
id = "plan"
kind = "artifact"
optional = true
note = """
The plan artifact that passed critique, in this run's work location
(.agent-work/<work-id>/) -- filled when this round releases (a `pass`, or a
`revise` you are not sending back) and left blank on any other word, since
none has anything intact to project. Filling it projects the one
gate the round ahead cut into its own dispatch -- a projection of the
planner's own form, never a copy typed here: purpose, scope, proof and any
model or direction override cross into the child's prefill; the horizon
behind them does not. The critics who just judged the round could see the
whole future plan; the gate that executes it sees only its own piece."""

# `calls` is written last, after the scalar `resolution` and `plan`, because
# a plan field renders as a bare `[[calls]]` header and every scalar declared
# after it would nest inside that array's last block instead of standing as
# its own field (tests/test_reachable_briefs.py holds the whole tree to
# this). The reading order is the other one: rule the findings, then say
# where the round goes.
[[field]]
id = "calls"
kind = "plan"
optional = true
note = """
One block per finding the panel returned -- every one of them gets a
call, and the call is where the finding goes.

`writer` -- the planner's to take or reject on an `incorporate`. The call
most findings take, true or not: the planner judges its own cut, and how
the gate gets built is the implementer's, below either of you.
`severe` -- the finding changes which problem the run is solving, or the
fundamental thing this gate would code. A round with one is a `rewrite`,
and your `orders` say what the fresh cut must do instead.
`beyond` -- real, and outside what this plan set out to do. It is
journaled as a triage note when you submit and reaches the close form
from there, and never becomes work here.

An `up` carries the whole table, every call beside its finding, to the
tier the ask stands at. Quote each finding as it was written rather than
numbering it: on an `incorporate` the `writer` blocks are literally what
the planner arrives holding. Leave the field out only where no panel
returned findings -- every cut after a release has none."""

  [[field.item]]
  id = "finding"
  note = "The panel's finding as it was written -- quoted, never summarised."

  [[field.item]]
  id = "call"
  kind = "decision"
  note = "writer | severe | beyond"
