# Transition: plan -> execute. Owned by run-an-issue; filled by the conductor.
# The critic panel reads every fresh cut: the run's opening one, a replan's,
# a rewrite's. This form is where the conductor rules on what the panel
# found. An incorporation, and a cut re-made after a gate landed, stand here
# with no panel. `resolution`, `orders` and `calls` are CONSOLIDATE.toml's
# (`same-as`): the two seams rule a panel's round the same way.

imperative = """
The cut is in the room above, with what each gate's `proof` did when the
engine ran it against the tree as it stands. Rule on the round.

1. Read the proof readings. A real proof fails here, before the work. One
   that passes proves nothing. One the shell could not run will fail the
   gate after the work is done. Either of those two is a finding for the
   planner.

2. Call every finding, in `calls`. You stand between the panel and the
   planner, and you judge each finding against the plan as a whole:
   `writer` where it holds at the plan's grain, `rejected: <reason>` where
   it does not hold, is not this plan's to answer, or is about how a gate
   gets built, which is the implementer's. The panel's `revise` is its
   word on its own findings. It is not a ruling on the cut.

3. Rule the round, in `resolution`:
   - `incorporate` (the default when you kept any finding): the planner
     takes or rejects the findings you called `writer`. What comes back is
     released here with no second panel.
   - `rewrite`: the findings you kept, one or several together, change
     which problem the run is solving or what the next gate would build.
     Write in `orders` the chunk the next cut must be. The fresh cut
     starts from your orders alone and gets its own panel.
   - release: you kept no finding, or you are standing on a cut that came
     back from the planner. Fill `plan` with the plan document's path.
     Nothing is retyped: every gate block the planner wrote is queued as
     it stands.
   - `up`: you cannot rule from here. The run pauses and asks one tier up."""

[[field]]
id = "resolution"
same-as = "assemblies/run-an-issue/forms/CONSOLIDATE.toml"

[[field]]
id = "orders"
same-as = "assemblies/run-an-issue/forms/CONSOLIDATE.toml"

[[field]]
id = "approach"
kind = "evidence"
optional = true
note = """
A ruling on how every later gate is cut, not on this one: the proof
standard, a convention the code holds to, a way of working this run has
settled. It joins the run's standing orders on this submit, whatever the
resolution, and every later cut and gate reads it. A value replaces what
stands, so write the whole text. `waived: none` leaves it as it is."""

[[field]]
id = "plan"
kind = "artifact"
optional = true
note = """
The path of the plan document, in this run's work location
(.agent-work/<work-id>/). Fill it only on a release; leave it blank on
`incorporate`, `rewrite` or `up`. Filling it queues every gate the planner
cut, in order, each with its own purpose, scope and proofs, and hands
every gate the call-tree."""

# `calls` is written last: a `kind = "plan"` field renders as a bare
# `[[calls]]` header, and TOML nests every scalar written after it into that
# array's last block. tests/test_reachable_briefs.py holds every form to this.
[[field]]
id = "calls"
same-as = "assemblies/run-an-issue/forms/CONSOLIDATE.toml"
