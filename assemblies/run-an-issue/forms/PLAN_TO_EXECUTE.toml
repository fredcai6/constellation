# Transition: plan → execute. Owned by run-an-issue. Two voices: the critic
# panel's verdicts return here -- a revise refills the plan interior with the
# findings, resolved through this transition's own `resolution` outcome row,
# three rounds of it reaching the plan segment's impasse form instead; on
# pass, submitting the form below releases it.

imperative = """
The plan has passed critique. There is nothing to author here: point at the
plan artifact that passed, and submit. The round the critics just judged
already cut the gate whole -- purpose, scope, proof, and any model or
direction override -- and submitting this mints it as its own dispatched
run, its fields carried across read-only."""

[[field]]
id = "plan"
kind = "artifact"
note = """
The plan artifact that passed critique, in this run's work location
(.agent-work/<work-id>/). Submitting this projects the one gate the round
ahead cut into its own dispatch -- a projection of the planner's own form,
never a copy typed here: purpose, scope, proof and any model or direction
override cross into the child's prefill; the horizon behind them does not.
The critics who just judged the round could see the whole future plan; the
gate that executes it sees only its own piece."""

[[field]]
id = "resolution"
kind = "decision"
optional = true
note = """
pass | revise, optional -- leave it blank. On an ordinary pass the critic
panel's own merged verdict already resolved this step before you filled the
form; on an impasse ruling that advanced over a live revise instead, no
panel sits on this mint at all, so there is no verdict to record. Typing
`pass` only re-records a clearing that already happened; typing anything
else mints a second, redundant rework round alongside the projection above,
not a correction to it."""
