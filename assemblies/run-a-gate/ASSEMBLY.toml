# Assembly: run one gate. Opened by dispatch from a plan's gate spec; the
# spec (purpose, scope, proof, optional model, optional direction) is the
# opening prefill — there is nothing to fill at open, so it has no form.
#
# Four beats: open → implement → review → close. `review` is `work`'s own
# transition, a two-voices step the same shape as run-an-issue's plan seam:
# a panel the assembly declares reads the diff, and the conductor disposes of
# the round on ROUTE.toml. Nobody chooses the readers -- they are written
# here, so the engine mints them with the round (an agent copying three
# fixed blocks into a form is work the engine owns).

assembly = "run-a-gate"
conductor = "gate-conductor"

[[segment]]
id = "work"
interior = "steps"
step-form = "skills/implementer/forms/IMPLEMENT.toml"
# This segment has no rework-form, so every refill is another pass at the same
# diff. Two reworks succeed -- the first and second reviews each send the
# diff back for another pass -- and the third review's own revise reaches
# the impasse form instead of minting a fourth round (at most three critic
# dispatches per artifact).
impasse-after = 2
impasse-form = "forms/IMPASSE.toml"
worker = "implementer"
model = "standard"
decides = "ruling"     # IMPASSE.toml's; IMPLEMENT.toml has no such field
# A ceiling on the rounds this seam sends back in a row within this gate's
# own run (see issue113): counted as the rounds landed since the review last
# released one -- a `pass` or `close` -- so the count is the loop itself,
# never the gate's whole history. Outranks `impasse-after` where both
# would fire on the same send-back.
round-cap = 5

  [[segment.outcome]]
  value = "advance"
  # `transition` mints this segment's route form alone -- one disposal of the
  # live revise, no panel to argue with (`_mint_transition` never mints one),
  # and `close` there walks the gate to GATE_CLOSE.
  does = "transition"

  [[segment.outcome]]
  value = "rework"
  does = "rework"     # another implement round; no rework-form here, so step-form again

  [[segment.outcome]]
  value = "up"
  does = "pause"     # mints an ask into the parent and a marker here; see [pause-gate]

[segment.transition]
id = "review"
form = "forms/ROUTE.toml"
# Anchored because a gate reaching close without review has graded its own
# work: amending this away stays one journaled step, but it is loud in the
# ledger and in the parent's adjudication view.
anchor = true
# Two voices: the panel reads the diff and returns, and neither of its two
# words acts on its own -- both resolve to `release`, which mints nothing and
# leaves the step open, so every round is disposed of on ROUTE.toml. There
# is no third verdict word -- a root objection is a revise finding -- and
# `rework` is what carries one back into another implement round.
decides = "resolution"
# The conductor that rules here built the diff the panel read. So a reader's
# `revise` binds: while one stands, this form's answer is `rework`, or `up`
# to contest it at the run that dispatched the gate. A rework also hands its
# reader `set-aside`, the findings the conductor did not call blocking, so a
# reader and not the builder has the last look at them (`[panel-binds]`,
# engine/cli.py).
panel-binds = "revise"

  [[segment.transition.outcome]]
  value = "pass"
  does = "release"     # the panel's own word; the form is what releases the round

  [[segment.transition.outcome]]
  value = "revise"
  does = "release"     # likewise -- the findings are the record, the form is the ruling on them

  [[segment.transition.outcome]]
  value = "rework"
  does = "rework"     # another implement round, the blocking findings as its prefill

  [[segment.transition.outcome]]
  value = "close"
  does = "release"     # mints nothing; the run walks on to GATE_CLOSE

  [[segment.transition.outcome]]
  value = "up"
  does = "pause"     # an ask into the parent, and a marker here; see [pause-gate]

  # One criterion per panelist, the same rule as run-an-issue's panels: three
  # fresh-context readers disagreeing is a panel; one reader holding three
  # criteria is a reviewer with a checklist. A separate spec-fit reader sent
  # a round back 2 times in 29 on tennis_elo's runs, and the panel was
  # growing. But both remints on story_time's runs were a delivered artifact
  # that did not show what the spec asked, found by the conductor after all
  # four readers passed. So `claims` holds it, as the reader that already
  # opens what the gate writes for a person: no fifth reader.
  [[segment.transition.panel]]
  form = "skills/reviewer/forms/REVIEW.toml"
  worker = "reviewer"
  model = "standard"
  criteria = "tests: are these the right tests, or could the work be substantially wrong while they pass -- and does anything watch the important thing pass through the whole project rather than only its pieces"

  # `shape` is one question at two scales: placement against the existing
  # code and against the plan's call-tree, which the gate's prefill carries.
  # A separate reader for the call-tree would make the same judgment twice.
  [[segment.transition.panel]]
  form = "skills/reviewer/forms/REVIEW.toml"
  worker = "reviewer"
  model = "standard"
  criteria = "shape: does the change go where the system's shape says it goes -- through an existing thing and not beside it, a root fix and not a guard, special case or second path, and, where your orders hold a call-tree, into the THIS GATE nodes built to the contracts at their edges? A root fix that costs more lines beats a guard that costs fewer; simple means simple to understand. Name what should go through an existing thing instead of beside it, anything the change leaves that nothing needs, each edge it changed that another node relies on, and any work that belongs to an ahead node"

  [[segment.transition.panel]]
  form = "skills/reviewer/forms/REVIEW.toml"
  worker = "reviewer"
  model = "standard"
  criteria = "claims: does what the gate delivers say what was asked, and is every statement in it backed? First open what the gate produces for a person -- a trace, a report, a doc, printed output, a checked-in expectation -- and read it against the words of each obligation in your orders: name each obligation the delivered thing does not show. Then name each statement the diff writes -- in docs, reports, comments, its own change note -- that says more than what it ran establishes: a number carried from somewhere and not reproduced, or a cause stated as fact that nothing tested"

  # All eight of story_time's remints came from a conductor running the code
  # after a gate had been through review. A blind standard-tier reader on this
  # lens found a defect the conductor reminted for in four of five such gates;
  # on four clean gates its noise was setups no run could reach, hence "reach".
  [[segment.transition.panel]]
  form = "skills/reviewer/forms/REVIEW.toml"
  worker = "reviewer"
  model = "standard"
  criteria = "break: try to make the gate's purpose false. Write scenarios its own tests do not contain, ones a real run could reach, and run them through the project's real entry point rather than through the unit under test. A finding is something you ran; the diff tells you where to aim"

  # Every round after the first: one reader, reading for the two things a
  # later round has ever found -- the blocking findings answered, and nothing
  # the rework wrote now false. Those findings ride in on this round's own
  # prefill, the same blocks the rework itself was handed.
  [[segment.transition.rework-panel]]
  form = "skills/reviewer/forms/REVIEW.toml"
  worker = "reviewer"
  model = "standard"
  criteria = "rework: three things only. Is each finding under `findings` in your orders answered by this round's diff? Does anything the rework wrote -- a comment, a rationale, a test predicate -- say something the diff itself made false? And is any finding under `set-aside`, which the builder chose not to fix, a gap that still stands in this diff? Name each one that does"

[[segment]]
id = "close"

[segment.transition]
anchor = true
terminal = true
form = "forms/GATE_CLOSE.toml"
# No `filler`: an absent one defaults to the bare `conductor` indirection,
# so close is filled by whoever conducts this assembly rather than by a role
# named twice.
