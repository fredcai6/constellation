# Assembly: run one gate. Opened by dispatch from a plan's gate spec; the
# spec (purpose, scope, proof, optional model, optional direction) is the
# opening prefill — there is nothing to fill at open, so it has no form.

assembly = "run-a-gate"
conductor = "implementer"

[[segment]]
id = "work"
interior = "steps"
step-form = "skills/implementer/forms/IMPLEMENT.toml"
# This segment has no rework-form, so every refill is another pass at the same
# diff. After three, a further revise mints the impasse form instead.
impasse-after = 3
impasse-form = "forms/IMPASSE.toml"
worker = "implementer"
model = "standard"
decides = "ruling"     # IMPASSE.toml's; IMPLEMENT.toml has no such field

  [[segment.outcome]]
  value = "advance"
  does = "transition"     # mints the review alone, over the live revise

  [[segment.outcome]]
  value = "rework"
  does = "rework"     # another implement round; no rework-form here, so step-form again

  [[segment.outcome]]
  value = "up"
  does = "release"     # mints nothing; the run walks to its terminal step

[segment.transition]
id = "review"
anchor = true
# Anchored because a gate reaching close without review has graded its own
# work: amending this away stays one journaled step, but it is loud in the
# ledger and in the parent's adjudication view.
form = "forms/REVIEW_ROUND.toml"
# Two voices: the panel reads the diff and returns, and neither of its two
# words acts on its own -- both resolve to `release` below, which mints
# nothing and leaves this step open, so every round is disposed of on the
# form above. That is the point of the shape: a revise is exactly the round
# with findings to rule on, and a mechanical refill never stood anyone on a
# form to rule on them. There is still no third verdict word -- a root
# objection is a revise finding -- and `rework` is what carries one back
# into the interior, only three of those in a row reaching `work`'s own
# impasse-form above, whose `up` is the way out this transition itself does
# not carry.
# No `filler`: every mint site defaults an absent one to the bare
# `conductor` indirection, which resolves to this assembly's own conductor,
# so this transition follows a rename of that field with no edit here.
decides = "resolution"     # both voices answer it: the panel's merged verdict, then the form's own

  [[segment.transition.outcome]]
  value = "pass"
  does = "release"     # mints nothing; the form above is what releases the round

  [[segment.transition.outcome]]
  value = "revise"
  does = "release"     # likewise -- the findings are the record, the form is the ruling on them

  [[segment.transition.outcome]]
  value = "rework"
  does = "rework"     # another implement round, findings as prefill

  [[segment.transition.outcome]]
  value = "close"
  does = "release"     # mints nothing; the run walks past review to GATE_CLOSE

  [[segment.transition.panel]]
  form = "skills/reviewer/forms/REVIEW.toml"
  worker = "reviewer"
  model = "standard"
  criteria = "the gate spec, whole and only"

[[segment]]
id = "close"

[segment.transition]
anchor = true
terminal = true
form = "forms/GATE_CLOSE.toml"
filler = "implementer"
