# Assembly: run one gate. Opened by dispatch from a plan's gate spec; the
# spec (purpose, scope, proof, optional model, optional direction) is the
# opening prefill — there is nothing to fill at open, so it has no form.

assembly = "run-a-gate"
conductor = "implementer"

[[segment]]
id = "work"
interior = "steps"
step-form = "skills/implementer/forms/IMPLEMENT.toml"
# This segment has no rework-form, so every refill is another pass at the same
# diff. After three, a further revise mints the impasse form instead.
impasse-after = 3
impasse-form = "forms/IMPASSE.toml"
worker = "implementer"
model = "standard"
decides = "ruling"     # IMPASSE.toml's; IMPLEMENT.toml has no such field

  [[segment.outcome]]
  value = "advance"
  does = "transition"     # mints the review alone, over the live revise

  [[segment.outcome]]
  value = "rework"
  does = "rework"     # another implement round; no rework-form here, so step-form again

  [[segment.outcome]]
  value = "up"
  does = "release"     # mints nothing; the run walks to its terminal step

[segment.transition]
id = "review"
anchor = true
# Anchored because a gate reaching close without review has graded its own
# work: amending this away stays one journaled step, but it is loud in the
# ledger and in the parent's adjudication view.
# no conductor form: release/refill/up is mechanical from the verdicts —
# pass releases, any revise refills the interior with merged findings,
# escalate goes up

  [[segment.transition.panel]]
  form = "skills/reviewer/forms/REVIEW.toml"
  worker = "reviewer"
  model = "standard"
  criteria = "the gate spec, whole and only"

[[segment]]
id = "close"

[segment.transition]
anchor = true
terminal = true
form = "forms/GATE_CLOSE.toml"
filler = "implementer"
