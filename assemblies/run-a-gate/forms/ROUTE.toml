# Transition: work -> close, as `work`'s own `review`. Owned by run-a-gate;
# filled by whoever conducts the gate. The review panel reads the diff and
# returns first; this form is where the conductor rules on its round, after
# a pass as much as after a revise.

imperative = """
The review has returned. Its findings are in the room above. Rule on the
round.

1. Call every finding, in `calls`: `blocking`, `accepted`, or
   `rejected: <reason>`. Read each finding as written. A `revise` verdict
   is not an invitation to argue with the reviewer.

2. Say where the round goes, in `resolution`:
   - `rework`: back to the implement step. The findings you called
     `blocking` go with it, and nothing else does.
   - `close`: the gate goes on to its close form. Use it after a pass, and
     after a revise where you called no finding blocking.
   - `up`: you cannot rule from here, usually because the gate spec is
     wrong. The gate pauses and asks the run that dispatched it.

A deviation the implementer declared is already on the record. Call one
only where you contest it."""

[[field]]
id = "resolution"
kind = "decision"
note = """
pass | revise | rework | close | up.

`pass` and `revise` are the panel's words. Typed here, both release the
round exactly as `close` does; `revise` sends nothing back.
`rework`: another implement round, carrying the findings you call
`blocking` and nothing else. One reviewer reads that round. After the
allowed number of reworks the impasse form comes instead.
`close`: release this round and go to the gate's close form.
`up`: pause this gate and ask the run that dispatched it. Its answer comes
back as this gate's next round. Say what you are asking in `calls`, on the
finding it belongs to."""

[[field]]
id = "orders"
kind = "evidence"
optional = true
note = """
Your own words for a rework round: a ruling the rework must hold that no
finding states, or a boundary you are drawing. It goes to the implementer
ahead of the blocking findings. `waived: none` where the findings say it
all. Never put an order in `calls` as if the panel had written it."""

# `calls` is written last: a `kind = "plan"` field renders as a bare
# `[[calls]]` header, and TOML nests every scalar written after it into that
# array's last block. tests/test_reachable_briefs.py holds every form to this.
[[field]]
id = "calls"
kind = "plan"
optional = true
note = """
One block per finding the review returned. Every finding gets a call.

`blocking`: the gate spec is not filled while this stands. On a `rework`
the blocking findings are the next round's orders.

`accepted`: true, and you are not acting on it. You owe no reason. Most
findings that do not block take this call. Exception: a finding that
proposes deleting something (an obligation, a gate, a field, a file) is
never `accepted`. Call it `blocking` or `rejected: <reason>`, because an
accepted deletion reads to the next round as consent to delete.

`rejected: <reason>`: not true of this diff, or real but not this gate's
to answer. The reason is required. Where the finding claims something
about what the code does, the reason names the command that refuted it.

Quote each finding as it was written; do not number or summarise it. On a
`rework` the blocking blocks are exactly what the implementer receives,
so a call naming `F1` hands it the string `F1`. Add a block for a declared
deviation only where you contest it. Leave the field out only where the
review returned no findings and you contest no deviation."""

  [[field.item]]
  id = "finding"
  note = """
The review finding as the reviewer wrote it, or the deviation as the
implementer declared it. Quote it; do not summarise."""

  [[field.item]]
  id = "call"
  kind = "decision"
  note = "blocking | accepted | rejected: <reason>"
