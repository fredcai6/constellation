# Transition: review → close. Owned by run-a-gate; filled by whoever conducts
# the gate. Minted by `select`, together with the panel above it, so this form
# and the panelists it disposes of are chosen in the same breath. Two voices:
# the review panel reads the diff and returns first, and this form is where
# its round is disposed of -- on a revise as much as on a pass, since a round
# with findings in it is exactly the round somebody has to rule on. The
# panel's verdict is above in the room; this is the answer to it.

imperative = """
The review has returned. Read its findings as written -- a revise is not an
invitation to argue the verdict you were given -- and say where this round
goes: back into the diff, or out to close. Then call every finding it
returned, one by one; a `rework` carries the ones you call blocking and
nothing else. A deviation the implementer declared is already on the record
in its own form: call one only where you contest it, never to accept it --
forty-eight of sixty-nine calls across five runs were deviations re-quoted
and accepted."""

[[field]]
id = "resolution"
kind = "decision"
note = """
pass | revise | rework | close | up. The first two are the panel's own words,
resolved onto this same table when its verdicts returned -- record one if you
want the record explicit, but both release the round exactly as `close` does,
so `revise` typed here does not send anything back. Your own three are the
last three: `rework` is another implement round back in `work`, carrying the
findings you call `blocking` below and nothing else -- and it takes you
through `select` again, so the lenses that read the next round are chosen
fresh rather than inherited; after `impasse-after` of them the ruling form
comes instead. `close` releases this round and walks the gate to its close,
which is the answer after a pass and the answer after a revise you have
decided not to run. `up` is the round you cannot rule on from here, the spec
being wrong the usual reason: it pauses this gate rather than closing it, an
ask standing at the run that dispatched you until it answers -- with what it
answers carried back as this gate's own next round. Say the ask in `calls`
below where it belongs to a finding, since that call is what the ask itself
carries up."""

[[field]]
id = "orders"
kind = "evidence"
optional = true
note = """
Your own words for the next round, where you are sending one back: a ruling
the rework must hold that no finding says, a boundary you are drawing. It
rides into the rework's prefill ahead of the blocking findings, as yours.
`waived: none` where the findings say it all. Never write an order into
`calls` as if the panel had returned it."""

# `calls` is written last, after the scalar `resolution`, because a plan
# field renders as a bare `[[calls]]` header and every scalar declared after
# it would nest inside that array's last block instead of standing as its own
# field (tests/test_reachable_briefs.py holds the whole tree to this). The
# reading order is the other one: rule the findings, then say where the round
# goes.
[[field]]
id = "calls"
kind = "plan"
optional = true
note = """
One block per finding the review returned -- every one of them gets a
call, and this form is the only place any of them is ruled on -- and per
declared deviation only where you contest it. A deviation you are
keeping is the ordinary case and takes `accepted` like any other row.

`blocking` -- the spec is not filled while this stands. `accepted` --
you are not acting on it, and you owe no reason why. The rubber stamp,
and the call most findings should take: the round stands, nothing
carries, and the record is that you called it. A finding that proposes
deleting something -- a commitment, a gate, a field, a file -- takes
`blocking` or `rejected: <reason>` and never `accepted`: three runs
running, an accepted call on a deletion was read by the next round as
consent to it, and a deletion the round stands anyway on is a deletion
nobody made. Keeping the thing is the call that owes the argument.

`beyond` -- real, and outside what this gate set out to do. It is
journaled as a triage note when you submit and reaches the close form
from there, so it leaves as a candidate without anyone retyping it, and
never as work here. `rejected` -- not true of this diff, or not this
gate's to answer, and the one call that owes a reason: fold it in after
a colon, the way `rejected: the path it names is covered at line 40`
reads. A `rejected` call on a finding that claims something about what
the code does names the command that refuted it, the way an issue's
`measured` type carries its command.

Where each call goes is the whole vocabulary. A `rework` carries the
blocking ones and nothing else, so a blocking call is that round's
orders. An `up` carries the whole table -- every call beside its finding
-- to the tier the ask stands at. A `beyond` is journaled as a triage
note the moment you submit, and arrives at this run's close form for
routing into an issue. `accepted` and `rejected` go nowhere by design:
the record is that you called them.

Quote what you are calling as it was written rather than numbering it:
on a `rework` the blocking blocks are literally what the next round
arrives holding, so a call naming `F1` hands that round the string `F1`.
Leave the field out only where the review returned no findings and you
contest no deviation."""

  [[field.item]]
  id = "finding"
  note = """
The review finding as the reviewer wrote it, or the deviation as the
implementer declared it -- quoted, never summarised."""

  [[field.item]]
  id = "call"
  kind = "decision"
  note = "blocking | accepted | beyond | rejected: <reason>"
