# Step: impasse. Owned by run-a-gate; filled by the implementer, who conducts
# this gate. Minted in place of a fourth implement round once the review has
# sent the same diff back `impasse-after` times. It carries no panel: a fourth
# cold reader is the loop, not the way out of it.

imperative = """
The review has sent this diff back three times. Rule on the loop, not on the
findings: three reviews landing on the same thing means the gate spec, not the
diff, is what keeps failing. Say which way this gate goes, and what the three
rounds had in common."""

[[field]]
id = "ruling"
kind = "decision"
note = """
advance | rework | up. `advance` closes the gate on the diff as it stands, over
a live revise — the review's findings remain the record that says you did, and
your parent adjudicates them. `rework` is another implement round, and is the
answer only when you can name what it changes that the last three did not. `up`
stops this gate and puts it to the run that dispatched you, which is what to do
when the spec is the thing that is wrong."""

[[field]]
id = "why"
kind = "evidence"
note = """
What the three reviews had in common, and what that says about the spec. Name
the field or the claim the findings kept landing on."""
