# Transition: work → review. Owned by run-a-gate; filled by whoever conducts
# the gate. One voice, no panel: this is where the readers are chosen, not
# where they answer. Submitting it mints the review step itself -- the
# panelists named below and the route form their round is disposed of on --
# so a gate that never fills this has no review to fire, and a gate that
# fills it twice has had two rounds read by two panels it chose separately.

imperative = """
The diff is in. Say which lenses read it, before anybody is dispatched. On
a first round three are the default and go on the panel unless something
about this diff makes one of them inert; a fourth is warranted when the
change reaches somewhere none of them looks. On the round after a rework one
reader is the default, reading for exactly two things: that each blocking
finding is answered, and that nothing the rework wrote -- a comment, a
rationale, a test predicate -- says something the diff itself made false,
which is the one defect a second round ever found across five runs. Submitting this dispatches nobody -- it mints the
review step. In a repository whose palette carries a `dispatch` entry, no
command ever prints there; `wait` is what starts each panelist. Where no
such entry is configured, the room still prints one command per panelist,
for you to run by hand."""

[[field]]
id = "omitted"
kind = "evidence"
optional = true
note = """
Which default this round leaves off the panel and what makes it inert, in one
line. Blank or `waived: none` when nothing is left off -- twenty-six of
twenty-seven fills were that answer, several as a paragraph."""

[[field]]
id = "panelists"
kind = "plan"
mints = "panelists"
note = """
One block per reader this round dispatches, minted onto the review step as
its panel the moment this releases. The three defaults are written out here
rather than left to be remembered, because they are what you copy in:
spec-fit -- "does the work fill the specification, whole and only"; test
adequacy -- "are these the right tests, or could the work be substantially
wrong while they pass"; and simplicity -- "argue for the smaller diff and name
what to delete -- anything added beside an existing thing rather than through
it is the first suspect". All three are worker `reviewer` at model `standard`,
and simplicity is a first-round default only: a rework round keeps its single
reader. Add a block where the diff reaches somewhere none of these lenses
looks, and name above the one you dropped. Every block needs all three values: `worker` and `model` are
the hand and the tier the brief dispatches under, and a block missing either
renders a brief nobody can run."""

  [[field.item]]
  id = "worker"
  note = "The role that reads -- `reviewer` for all three defaults."

  [[field.item]]
  id = "model"
  note = "The tier the brief dispatches under -- `standard` for all three defaults."

  [[field.item]]
  id = "criteria"
  note = "The lens itself, verbatim: what this reader looks for, and nothing else."
