# Anchor: close. Owned by run-a-gate; filled by whoever conducts the gate.
# Everything on this form returns — stamped into the parent's waiting gate
# transition, where `claims` opens the issue-conductor's own `dispositions`
# blocks already written, for it to accept or contest. The engine appends
# the mechanical record itself: how many steps landed, the implement/review
# cycle count, the final verdict, the change and deviations from the last
# implement step, the check outputs, the model tier dispatched under, and
# this run's amend summary (segment, reason, anchor touched or not).

imperative = """
Close the gate. Claim the obligations this gate was cut against, each on
the root that shows it. The engine commits the work itself once the parent
accepts this return -- one commit, on the issue's own branch, for the gate
that just proved out. The rest of the record returns mechanically; add only
what the parent cannot read from it."""

[[field]]
id = "residue"
kind = "evidence"
note = """
What the parent should know that no recorded field carries. Answer this
gate's own `direction` first where its orders carry one -- that field is a
question the plan asked this gate on the next plan round's behalf, and this
is the only place it is ever answered. Then anything else: an observation
worth recording, a surprise in the terrain, a check that passes but smells.
Or waived: none."""

[[field]]
id = "claims"
kind = "plan"
optional = true
note = """
The obligations this gate was cut against, one block each, by the row id
your orders' `obligations` carries (o1, o2 ...). Each claim is yours to
make: the word, and the root that shows it -- the test, the artifact, the
command and its output, not the reviewers' verdict. The issue-conductor
accepts or contests each claim and re-derives none, so a root it cannot
open is a claim it cannot accept. Claim `owed:` for one you did not
satisfy and are not the one to defer -- see the word's own note below.
Leave blank where this gate was cut against none."""

  [[field.item]]
  id = "obligation"
  note = "The obligation's row id on the execution-state board, e.g. o1."

  [[field.item]]
  id = "disposition"
  note = """
satisfied | deferred: <reason> | invalidated: <reason> | rejected: <reason>
| owed: <reason>

`deferred` says this run is not doing it, and why; if someone else is
(another issue, a PR), the reason names them. `owed` says the opposite: this
run still must do it, and this gate was not the place -- the reason is why it
was not yours, never who takes it next. You do not know that; the plan
does not yet either, and may not decide at the next cut. `owed` does not
settle the row -- the issue-conductor's adjudication and every later gate
still see it in their orders, exactly as an `open` row would, until someone
actually satisfies, defers, or otherwise disposes of it."""

  [[field.item]]
  id = "root"
  note = """
What shows the word: a test, an artifact path, a command and its output.
For `owed`, the root that shows the obligation was out of this gate's own
scope -- your orders' `scope` text, or the spec passage that puts it
elsewhere -- not a reason repeated a second time."""
