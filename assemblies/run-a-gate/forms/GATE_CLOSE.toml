# Anchor: close. Owned by run-a-gate; filled by the gate executor.
# Everything on this form returns — stamped into the parent's waiting gate
# transition. The engine appends the mechanical record itself: the final
# verdict, the change and deviations from the last implement step, the check
# outputs, the implement/review cycle count, the model tier dispatched under,
# and this run's amend summary (segment, reason, anchor touched or not).

imperative = """
Close the gate. The record returns mechanically; add only what the parent
cannot read from it."""

[[field]]
id = "residue"
kind = "evidence"
note = """
What the parent should know that no recorded field carries — observations
noted for triage, a surprise in the terrain, a check that passes but smells.
Or waived: none."""
